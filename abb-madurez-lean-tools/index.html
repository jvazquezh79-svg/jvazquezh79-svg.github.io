erfil": "Soporte / ingeniería", "perfil_en": "Support / engineering", "q": "¿Qué es 5S y por qué es importante?", "a": "Método para organizar y mantener el lugar de trabajo (Clasificar, Ordenar, Limpiar, Estandarizar, Sostener); habilita el flujo y la seguridad.", "q_en": "What is 5S and why does it matter?", "a_en": "A method to organize and sustain the workplace (Sort, Set in order, Shine, Standardize, Sustain); it enables flow and safety."}, {"tool": "5S", "lvl": 1, "perfil": "Operativo", "perfil_en": "Operator", "q": "¿Qué herramientas usas en tu área para organizar (5S)?", "a": "Tableros de sombra, rutinas de limpieza, listas de verificación y auditorías 5S.", "q_en": "Which tools do you use in your area to organize (5S)?", "a_en": "Shadow boards, cleaning routines, checklists and 5S audits."}, {"tool": "Gestión visual", "lvl": 3, "perfil": "Soporte / ingeniería", "perfil_en": "Support / engineering", "q": "¿Qué dos indicadores mejoran con 5S y un sistema de señales?", "a": "Dos de: rendimiento a la primera (FPY), productividad, entrega a tiempo, desperdicio/defectos, tiempo muerto, exactitud de inventario, seguridad.", "q_en": "Which two indicators improve with 5S and a signal system?", "a_en": "Two of: first-pass yield (FPY), productivity, on-time delivery, waste/defects, downtime, inventory accuracy, safety."}, {"tool": "Andon y escalamiento", "lvl": 2, "perfil": "Soporte / ingeniería", "perfil_en": "Support / engineering", "q": "¿Cómo funciona el sistema de señales (andon)?", "a": "Avisa a las personas correctas cuando hay un problema; muestra visualmente el estado del proceso o del programa.", "q_en": "How does the signal system (andon) work?", "a_en": "It alerts the right people when there is a problem; it shows the process or schedule status visually."}, {"tool": "Andon y escalamiento", "lvl": 3, "perfil": "Operativo", "perfil_en": "Operator", "q": "Si una línea o máquina se detiene, ¿cómo lo señalas?", "a": "Con el andon (luz, botón o señal definida) según el procedimiento del área.", "q_en": "If a line or machine stops, how do you signal it?", "a_en": "With the andon (light, button or defined signal) according to the area procedure."}, {"tool": "Andon y escalamiento", "lvl": 4, "perfil": "Operativo", "perfil_en": "Operator", "q": "¿En cuánto tiempo deben responder a un paro?", "a": "En 5 minutos o menos (supervisor, líder o ingeniería); verificar con una prueba.", "q_en": "How fast should a stop be answered?", "a_en": "Within 5 minutes or less (supervisor, leader or engineering); verify with a test."}, {"tool": "Layout y flujo continuo", "lvl": 1, "perfil": "Soporte / ingeniería", "perfil_en": "Support / engineering", "q": "¿Por qué el flujo es mejor que los lotes grandes?", "a": "Uno de: menos WIP e inventario, detección rápida de defectos, respuesta más rápida al cliente, menos espacio, mejor balanceo.", "q_en": "Why is flow better than large batches?", "a_en": "One of: less WIP and inventory, fast defect detection, faster customer response, less space, better balance."}, {"tool": "Layout y flujo continuo", "lvl": 1, "perfil": "Operativo", "perfil_en": "Operator", "q": "¿Por qué conviene trabajar en lotes pequeños o una orden a la vez?", "a": "Dos de: menos desperdicio, menos inventario, entrega más rápida, mejor desempeño de la planta.", "q_en": "Why work in small lots or one order at a time?", "a_en": "Two of: less waste, less inventory, faster delivery, better plant performance."}, {"tool": "Pull, kanban y pacemaker", "lvl": 2, "perfil": "Soporte / ingeniería", "perfil_en": "Support / engineering", "q": "¿Qué dos cosas ayudan a producir en lotes pequeños o flujo de una pieza?", "a": "Dos de: pull, producir contra orden, celdas, kanban, kits en punto de uso, balanceo, flexibilidad de personal, SMED.", "q_en": "Which two things help produce in small lots or one-piece flow?", "a_en": "Two of: pull, build to order, cells, kanban, point-of-use kits, balancing, staffing flexibility, SMED."}, {"tool": "Takt y trabajo estandarizado", "lvl": 3, "perfil": "Soporte / ingeniería", "perfil_en": "Support / engineering", "q": "¿Qué es el takt time?", "a": "Ritmo al que debe producirse para cumplir la demanda: tiempo disponible ÷ cantidad requerida (en ETO: horas de carga ÷ tiempo disponible).", "q_en": "What is takt time?", "a_en": "The pace at which to produce to meet demand: available time ÷ required quantity (in ETO: load hours ÷ available time)."}, {"tool": "Takt y trabajo estandarizado", "lvl": 3, "perfil": "Operativo", "perfil_en": "Operator", "q": "¿Qué marca el ritmo de tu área?", "a": "Identifica el paso más lento y conoce la producción esperada del día.", "q_en": "What sets the pace of your area?", "a_en": "Identifies the slowest step and knows the expected daily output."}, {"tool": "Pull, kanban y pacemaker", "lvl": 4, "perfil": "Soporte / ingeniería", "perfil_en": "Support / engineering", "q": "¿Cuál es el pacemaker de la planta?", "a": "El proceso al que se programa la demanda y que jala material de los procesos anteriores. Si no está identificado, 0.", "q_en": "What is the plant's pacemaker?", "a_en": "The process demand is scheduled to, which pulls material from upstream processes. If not identified, 0."}, {"tool": "Pull, kanban y pacemaker", "lvl": 2, "perfil": "Soporte / ingeniería", "perfil_en": "Support / engineering", "q": "¿Cómo funciona un kanban o sistema pull?", "a": "Señal (tarjeta, contenedor o electrónica) que autoriza reponer material al proceso anterior o al proveedor cuando se consume.", "q_en": "How does a kanban or pull system work?", "a_en": "A signal (card, container or electronic) authorizes replenishment from the upstream process or supplier when material is consumed."}, {"tool": "TPM (Mantenimiento productivo total) y OEE", "lvl": 1, "perfil": "Soporte / ingeniería", "perfil_en": "Support / engineering", "q": "Menciona un componente del TPM.", "a": "Uno de: mantenimiento autónomo, mantenimiento planeado, entrenamiento en operación y mantenimiento, gestión temprana del equipo.", "q_en": "Name one TPM component.", "a_en": "One of: autonomous maintenance, planned maintenance, operation and maintenance training, early equipment management."}, {"tool": "TPM (Mantenimiento productivo total) y OEE", "lvl": 2, "perfil": "Soporte / ingeniería", "perfil_en": "Support / engineering", "q": "¿Qué es el OEE?", "a": "OEE = Disponibilidad × Desempeño × Calidad; mide la efectividad real del equipo.", "q_en": "What is OEE?", "a_en": "OEE = Availability × Performance × Quality; it measures the real effectiveness of equipment."}, {"tool": "TPM (Mantenimiento productivo total) y OEE", "lvl": 3, "perfil": "Soporte / ingeniería", "perfil_en": "Support / engineering", "q": "¿Qué caracteriza a un TPM de clase mundial?", "a": "Sin mantenimiento reactivo ni paros por falla; maximiza la productividad del equipo en su ciclo de vida; operadores y mantenimiento trabajan en equipo.", "q_en": "What characterizes world-class TPM?", "a_en": "No reactive maintenance or breakdown stops; maximizes equipment productivity over its life cycle; operators and maintenance work as a team."}, {"tool": "TPM (Mantenimiento productivo total) y OEE", "lvl": 1, "perfil": "Operativo", "perfil_en": "Operator", "q": "¿Qué busca evitar un programa TPM?", "a": "Paros y fallas, mediante mantenimiento preventivo y autónomo realizado en el área.", "q_en": "What does a TPM program try to prevent?", "a_en": "Stops and breakdowns, through preventive and autonomous maintenance done in the area."}, {"tool": "TPM (Mantenimiento productivo total) y OEE", "lvl": 2, "perfil": "Operativo", "perfil_en": "Operator", "q": "¿En qué máquinas haces TPM y qué le haces?", "a": "Nombra la máquina y demuestra la rutina (limpieza, inspección, lubricación).", "q_en": "On which machines do you do TPM and what do you do?", "a_en": "Names the machine and demonstrates the routine (cleaning, inspection, lubrication)."}, {"tool": "Poka-yoke y calidad en la fuente", "lvl": 1, "perfil": "Soporte / ingeniería", "perfil_en": "Support / engineering", "q": "¿Cómo identificas y reaccionas ante una parte mala?", "a": "Identificar, documentar y comunicar, poner en cuarentena (zona de no conforme) y hacer acción correctiva.", "q_en": "How do you identify and react to a bad part?", "a_en": "Identify, document and communicate, quarantine (non-conforming area) and take corrective action."}, {"tool": "Poka-yoke y calidad en la fuente", "lvl": 3, "perfil": "Soporte / ingeniería", "perfil_en": "Support / engineering", "q": "Da dos ejemplos de herramientas preventivas usadas en la planta.", "a": "Dos de: instrucciones de trabajo, autoinspección e inspección sucesiva, poka-yoke, SPC, Cp/Cpk, PFMEA.", "q_en": "Give two examples of preventive tools used in the plant.", "a_en": "Two of: work instructions, self and successive inspection, poka-yoke, SPC, Cp/Cpk, PFMEA."}, {"tool": "Poka-yoke y calidad en la fuente", "lvl": 3, "perfil": "Operativo", "perfil_en": "Operator", "q": "Describe dos herramientas que usas para prevenir errores de calidad.", "a": "Poka-yoke, listas de verificación, revisiones visuales, gages o inspección en el área.", "q_en": "Describe two tools you use to prevent quality errors.", "a_en": "Poka-yoke, checklists, visual checks, gauges or in-area inspection."}, {"tool": "Solución de problemas", "lvl": 2, "perfil": "Soporte / ingeniería", "perfil_en": "Support / engineering", "q": "¿Para qué sirve un Pareto de defectos?", "a": "Ordena los defectos del más al menos frecuente para enfocar el trabajo en los principales.", "q_en": "What is a defect Pareto for?", "a_en": "It ranks defects from most to least frequent to focus work on the main ones."}, {"tool": "Solución de problemas", "lvl": 2, "perfil": "Operativo", "perfil_en": "Operator", "q": "¿Cómo y dónde usas un Pareto en tu área?", "a": "Conoce las principales causas de desperdicio o retrabajo y cómo se registran.", "q_en": "How and where do you use a Pareto in your area?", "a_en": "Knows the main causes of scrap or rework and how they are recorded."}, {"tool": "Solución de problemas", "lvl": 2, "perfil": "Soporte / ingeniería", "perfil_en": "Support / engineering", "q": "Menciona tres de los ocho desperdicios.", "a": "Transporte, inventario, movimiento, espera, sobreproducción, sobreprocesamiento, defectos, talento no utilizado.", "q_en": "Name three of the eight wastes.", "a_en": "Transportation, inventory, motion, waiting, overproduction, overprocessing, defects, unused talent."}, {"tool": "Gestión diaria", "lvl": 1, "perfil": "Soporte / ingeniería", "perfil_en": "Support / engineering", "q": "¿Qué indicadores se siguen en las celdas o áreas?", "a": "Al menos tres indicadores del tablero de la celda (SQDC).", "q_en": "Which indicators are tracked in cells or areas?", "a_en": "At least three indicators from the cell board (SQDC)."}, {"tool": "Gestión diaria", "lvl": 1, "perfil": "Operativo", "perfil_en": "Operator", "q": "¿Qué indicadores del scorecard se siguen en tu área?", "a": "Al menos tres indicadores del tablero de su área.", "q_en": "Which scorecard indicators are tracked in your area?", "a_en": "At least three indicators from their area board."}, {"tool": "Gestión diaria", "lvl": 2, "perfil": "Operativo", "perfil_en": "Operator", "q": "¿Cómo sabes si tu área va en programa?", "a": "Tablero de producción, programa, kanban, FIFO o monitor de takt. 'Porque me lo dijo el supervisor' = 0.", "q_en": "How do you know if your area is on schedule?", "a_en": "Production board, schedule, kanban, FIFO or takt monitor. 'Because my supervisor said so' = 0."}, {"tool": "Kaizen", "lvl": 2, "perfil": "Operativo", "perfil_en": "Operator", "q": "¿Dónde registras tus sugerencias de mejora?", "a": "Ubica y explica la lista OIL o el tablero de mejora; hay registros de las últimas 6 semanas.", "q_en": "Where do you record your improvement suggestions?", "a_en": "Locates and explains the OIL list or improvement board; there are entries from the last 6 weeks."}], "glos": [["8D", "8D", "Método de solución de problemas en ocho disciplinas, enfocado en contener, encontrar la causa raíz y evitar la recurrencia.", "Eight-discipline problem-solving method focused on containment, root cause and preventing recurrence."], ["AMEF / PFMEA", "FMEA / PFMEA", "Análisis de modo y efecto de falla (de proceso): identifica qué puede fallar, su efecto y su prioridad de riesgo (NPR).", "(Process) Failure Mode and Effects Analysis: identifies what can fail, its effect and its risk priority (RPN)."], ["Andon", "Andon", "Sistema de señales visuales o sonoras para avisar de inmediato un problema y pedir ayuda.", "Visual or audible signal system to flag a problem immediately and call for help."], ["Cambio rápido (SMED)", "Quick changeover (SMED)", "Single-Minute Exchange of Die: método para reducir el tiempo de cambio convirtiendo trabajo interno en externo.", "Single-Minute Exchange of Die: method to reduce changeover time by converting internal work into external work."], ["CMMI / Modelo de madurez", "CMMI / Maturity model", "Marco que describe la evolución de un proceso por niveles, de inicial a optimizado. Inspira la escala 0–4 de este instrumento.", "Framework describing how a process evolves through levels, from initial to optimizing. It inspires this instrument's 0–4 scale."], ["Criterio", "Criterion", "Comportamiento o evidencia observable que define un nivel de una práctica. Se califica Cumple, No o NA.", "Observable behavior or evidence that defines a level of a practice. Rated Meets, No or N/A."], ["ETO (Engineer-to-Order)", "ETO (Engineer-to-Order)", "Estrategia en la que el diseño, la ingeniería y la compra ocurren después de recibir el pedido del cliente.", "Strategy in which design, engineering and purchasing happen after the customer order is received."], ["Evidencia", "Evidence", "Prueba observable en el gemba (documento, tablero, registro, foto o demostración). Sin evidencia no se marca Cumple.", "Observable proof in the gemba (document, board, record, photo or demonstration). Without evidence, do not mark Meets."], ["Gemba", "Gemba", "El lugar real donde se crea el valor (piso de producción, oficina de ingeniería).", "The real place where value is created (shop floor, engineering office)."], ["Gestión diaria", "Daily management", "Rutinas de liderazgo (juntas de arranque, tableros, recorridos) para sostener estándares y responder a problemas cada día.", "Leadership routines (start-up meetings, boards, walks) to sustain standards and respond to problems every day."], ["Heijunka", "Heijunka", "Nivelación del volumen y la mezcla de producción en el tiempo para evitar picos y valles.", "Leveling production volume and mix over time to avoid peaks and valleys."], ["Industria 5.0 / OpEx 5.0", "Industry 5.0 / OpEx 5.0", "Visión que agrega a la eficiencia los enfoques centrado en las personas, sostenible y resiliente; aplicada a la excelencia operacional.", "Vision that adds human-centric, sustainable and resilient approaches to efficiency, applied to operational excellence."], ["Kaizen", "Kaizen", "Mejora continua mediante cambios pequeños y frecuentes, o eventos enfocados de alta intensidad.", "Continuous improvement through small, frequent changes or focused high-intensity events."], ["Kanban", "Kanban", "Señal (tarjeta, contenedor o electrónica) que autoriza producir o reponer solo lo consumido.", "Signal (card, container or electronic) authorizing production or replenishment of only what was consumed."], ["Lección de un punto (LUP)", "One-point lesson (OPL)", "Hoja visual de una página que enseña una sola tarea o concepto, usada en TPM y estandarización.", "One-page visual sheet teaching a single task or concept, used in TPM and standardization."], ["Lista OIL", "OIL list", "Open Issues List: registro visible de problemas abiertos con responsable, solución y fecha.", "Open Issues List: visible record of open issues with owner, solution and date."], ["Mantenimiento autónomo", "Autonomous maintenance", "Pilar del TPM en el que el operador limpia, inspecciona y lubrica su equipo con un estándar.", "TPM pillar in which operators clean, inspect and lubricate their equipment to a standard."], ["Mapa de estado actual / futuro", "Current / future state map", "VSM de cómo opera hoy el flujo de valor y de cómo debe operar en un horizonte definido.", "VSM of how the value stream works today and how it should work within a defined horizon."], ["Meta (nivel meta)", "Target level", "Nivel que el equipo se compromete a alcanzar en el ciclo del roadmap; se recomienda subir un nivel por ciclo de 90 días.", "Level the team commits to reach in the roadmap cycle; one level per 90-day cycle is recommended."], ["Modelo Shingo", "Shingo Model", "Marco de excelencia empresarial que vincula herramientas, sistemas, principios guía y cultura con resultados.", "Enterprise-excellence framework linking tools, systems, guiding principles and culture to results."], ["NA (No aplica)", "N/A (Not applicable)", "Criterio que no corresponde al área evaluada; no cuenta como cumplido ni como incumplido.", "Criterion that does not apply to the area assessed; counts neither as met nor as unmet."], ["Nivel de madurez", "Maturity level", "Grado de implementación de una herramienta: 0 No implementado, 1 Inicio, 2 Mejora, 3 Consolidación, 4 Liderazgo.", "Degree of implementation of a tool: 0 Not implemented, 1 Initial, 2 Improving, 3 Consolidating, 4 Leading."], ["OEE", "OEE", "Overall Equipment Effectiveness = Disponibilidad × Desempeño × Calidad.", "Overall Equipment Effectiveness = Availability × Performance × Quality."], ["Pacemaker", "Pacemaker", "Proceso único al que se programa la demanda y que marca el ritmo de los procesos anteriores.", "Single process to which demand is scheduled; it sets the pace for upstream processes."], ["PFEP", "PFEP", "Plan for Every Part: base de datos con la información de cada parte (consumo, contenedor, ubicación, proveedor).", "Plan for Every Part: database with each part's data (usage, container, location, supplier)."], ["Poka-yoke", "Poka-yoke", "Dispositivo o método a prueba de error que impide o detecta el defecto en la fuente.", "Error-proofing device or method that prevents or detects the defect at the source."], ["Práctica", "Practice", "Elemento evaluable de una herramienta (p. ej., «Takt time»), con criterios por nivel.", "Assessable element of a tool (e.g., 'Takt time'), with criteria by level."], ["Pull (sistema jalar)", "Pull system", "Se produce solo lo que el proceso siguiente consume, con una señal de reposición.", "Produce only what the next process consumes, triggered by a replenishment signal."], ["Regla secuencial", "Sequential rule", "Un nivel superior solo puede marcarse Cumple si los niveles anteriores de la misma práctica se cumplen (o son NA).", "A higher level can be marked Meets only if the previous levels of the same practice are met (or N/A)."], ["Restricción", "Constraint", "Recurso que limita el desempeño de todo el sistema (Teoría de Restricciones). En ETO puede estar en ingeniería.", "Resource that limits the performance of the whole system (Theory of Constraints). In ETO it may sit in engineering."], ["Roadmap", "Roadmap", "Plan con los criterios a lograr para llegar al nivel meta: acción, responsable, fecha y evidencia de cierre.", "Plan with the criteria to achieve to reach the target level: action, owner, date and closing evidence."], ["SQDC", "SQDC", "Seguridad, Calidad, Entrega y Costo: indicadores básicos del scorecard de área.", "Safety, Quality, Delivery and Cost: basic indicators of the area scorecard."], ["Supermercado", "Supermarket", "Inventario controlado entre procesos, de donde el proceso cliente toma material y el proveedor repone.", "Controlled inventory between processes from which the customer process takes material and the supplier replenishes."], ["Takt time", "Takt time", "Ritmo de producción requerido por la demanda: tiempo disponible ÷ demanda. En ETO, horas de carga ÷ tiempo disponible.", "Production pace required by demand: available time ÷ demand. In ETO, load hours ÷ available time."], ["TPM", "TPM", "Total Productive Maintenance: sistema para maximizar la efectividad del equipo con participación de todos.", "Total Productive Maintenance: system to maximize equipment effectiveness with everyone's involvement."], ["Trabajo estandarizado", "Standardized work", "Mejor método actual para hacer una operación: secuencia, tiempo y WIP estándar. Es la base de la mejora.", "Current best method for an operation: sequence, time and standard WIP. It is the basis for improvement."], ["Umbral", "Threshold", "% mínimo de criterios de un nivel que deben cumplirse para alcanzarlo (80 % por omisión).", "Minimum % of a level's criteria that must be met to reach it (80% by default)."], ["VA / NVA", "VA / NVA", "Valor agregado (lo que el cliente paga) y no valor agregado (desperdicio o actividad necesaria sin valor).", "Value-added (what the customer pays for) and non-value-added (waste or necessary activity without value)."], ["VSM", "VSM", "Value Stream Mapping: mapa del flujo de materiales e información de la orden a la entrega.", "Value Stream Mapping: map of material and information flow from order to delivery."], ["WIP", "WIP", "Work in process: inventario en proceso entre operaciones.", "Work in process: inventory between operations."], ["Yamazumi", "Yamazumi", "Gráfica de balanceo que apila los elementos de trabajo por estación contra el takt.", "Balancing chart that stacks work elements per station against takt."]]};

/* ======================= SCORING ======================= */
function sc(e,code,k){const v=(e.scores[code]||{})[k];return v===undefined?null:v}
function passes(v){return v===1||v==="NA"}
function prevBlock(e,p,k){for(let j=1;j<k;j++){if(!(j in p.crit))continue;if(!passes(sc(e,p.code,j)))return j}return 0}
function maxLv(p){return Math.max(...Object.keys(p.crit).map(Number))}
function nextDef(p,lv){for(let k=lv+1;k<=4;k++)if(k in p.crit)return k;return null}
function practiceLevel(e,p){for(let k=1;k<=4;k++){if(!(k in p.crit))continue;if(!passes(sc(e,p.code,k)))return k-1}return maxLv(p)}
function enforceSeq(e,p){let broken=false,n=0;for(let k=1;k<=4;k++){if(!(k in p.crit))continue;const v=sc(e,p.code,k);if(broken&&v===1){e.scores[p.code][k]=0;n++}if(!passes(v))broken=true}return n}
function toolStats(e,tool){
  const ps=PRACT.filter(p=>p.tool===tool);
  const Lv=[0,0,0,0,0].map(()=>({pts:0,pos:0}));
  ps.forEach(p=>{for(let k=1;k<=4;k++){if(!(k in p.crit))continue;const v=sc(e,p.code,k);if(v==="NA")continue;Lv[k].pos++;if(v===1)Lv[k].pts++;}});
  const tmax=Math.max(...ps.map(maxLv));let level=tmax;
  for(let k=1;k<=tmax;k++){if(Lv[k].pos>0&&Lv[k].pts<e.umbral*Lv[k].pos-1e-9){level=k-1;break;}}
  const tp=Lv.reduce((s,x)=>s+x.pts,0),tpos=Lv.reduce((s,x)=>s+x.pos,0);
  const pend=level>=tmax?0:Math.max(0,Math.ceil(e.umbral*Lv[level+1].pos-1e-9)-Lv[level+1].pts);
  const ms=METR.filter(m=>m.tool===tool);let ep=0,em=0;ms.forEach(m=>{em+=Math.max(...m.opts.map(o=>o[1]));const r=e.metrics[m.code];if(r&&r.pts!=null)ep+=r.pts;});
  let qo=0,qn=0;DATA.quiz.forEach((q,i)=>{if(q.tool!==tool)return;const r=e.quiz[i];if(r&&r.n>0){qo+=Math.min(r.ok||0,r.n);qn+=r.n}});
  const meta=e.meta[tool]||null;
  return {tool,max:tmax,L:Lv,level,pct:tpos?tp/tpos:0,pend,exec:em?ep/em:null,quiz:qn?qo/qn:null,meta,gap:meta?Math.max(0,meta-level):null};
}
function allStats(e){return DATA.tools.map(x=>toolStats(e,x))}
function avgLevel(e){const s=allStats(e);return s.reduce((a,x)=>a+x.level,0)/s.length}
function progress(e){let a=0;PRACT.forEach(p=>Object.keys(p.crit).forEach(k=>{if(sc(e,p.code,+k)!==null)a++}));return a/TOTALCRIT}
function toolProgress(e,tool){let a=0,n=0;PRACT.filter(p=>p.tool===tool).forEach(p=>Object.keys(p.crit).forEach(k=>{n++;if(sc(e,p.code,+k)!==null)a++}));return n?a/n:0}
function roadRows(e){
  const st=Object.fromEntries(allStats(e).map(s=>[s.tool,s]));const rows=[];
  DATA.tools.forEach(tl=>PRACT.filter(p=>p.tool===tl).forEach(p=>{const lv=practiceLevel(e,p);const nx=nextDef(p,lv);const meta=st[tl].meta;
    rows.push({p,lv,nx,crit:nx?pcrit(p,nx):tx("Práctica completa en todos los niveles","Practice complete at all levels"),req:(meta&&nx&&nx<=meta)?"Sí":"No",meta,r:e.road[p.code]||{}})}));
  return rows;
}

/* ======================= RECOMMENDATIONS ======================= */
function recommendations(e,base){
  const st=allStats(e);const R=[];const avg=avgLevel(e);
  const isStab=x=>BLOQUE.stab.includes(x.tool);
  const score=x=>(isStab(x)?1.5:0)+(x.meta?x.meta-x.level:0)+(4-x.level)*0.5;
  const prio=[...st].sort((a,b)=>score(b)-score(a)).slice(0,3);
  const estLow=st.filter(x=>isStab(x)&&x.level<2);
  const list=a=>a.join(", ");
  if(estLow.length)R.push({p:1,t:tx("Asegurar primero la base de estabilidad","Secure the stability foundation first"),d:tx(`${list(estLow.map(s=>ts(s.tool)+" (N"+s.level+")"))} están por debajo del Nivel 2. Sin orden, estándares, gestión visual y equipos confiables, el flujo y el pull no se sostienen; conviene llevar estas herramientas a Nivel 2 antes de escalar flujo y kanban (Liker, 2021).`,`${list(estLow.map(s=>ts(s.tool)+" (L"+s.level+")"))} are below Level 2. Without order, standards, visual management and reliable equipment, flow and pull cannot be sustained; bring these tools to Level 2 before scaling flow and kanban (Liker, 2021).`)});
  const quick=st.filter(s=>s.level<s.max&&s.pend>0&&s.pend<=2);
  if(quick.length)R.push({p:1,t:tx("Victorias rápidas (30 días)","Quick wins (30 days)"),d:tx(`Con pocos cierres se sube de nivel en: ${quick.map(s=>`${ts(s.tool)} (faltan ${s.pend} para N${s.level+1})`).join("; ")}. Asignar dueño y fecha esta semana.`,`A few closures raise the level in: ${quick.map(s=>`${ts(s.tool)} (${s.pend} missing for L${s.level+1})`).join("; ")}. Assign owner and date this week.`)});
  const gaps=st.filter(s=>s.gap>0).sort((a,b)=>b.gap-a.gap);
  if(gaps.length)R.push({p:gaps[0].gap>=2?1:2,t:tx("Cerrar las brechas mayores contra la meta","Close the largest gaps to target"),d:tx(`Brechas más grandes: ${list(gaps.slice(0,4).map(s=>`${ts(s.tool)} (N${s.level}→N${s.meta})`))}. Subir un nivel por ciclo de 90 días; brechas de 2 o más niveles requieren un evento kaizen dedicado.`,`Largest gaps: ${list(gaps.slice(0,4).map(s=>`${ts(s.tool)} (L${s.level}→L${s.meta})`))}. Raise one level per 90-day cycle; gaps of 2+ levels need a dedicated kaizen event.`)});
  else if(!st.some(s=>s.meta))R.push({p:1,t:tx("Definir el nivel meta por herramienta","Set the target level for each tool"),d:tx("Aún no hay metas capturadas. Fijar con el equipo y el líder del área el nivel a alcanzar en 90 días (se recomienda +1 nivel) para activar el roadmap.","No targets yet. Agree with the team and area leader the level to reach in 90 days (+1 level recommended) to activate the roadmap.")});
  const noRes=st.filter(s=>s.level>=2&&s.exec!=null&&s.exec<0.5);
  if(noRes.length)R.push({p:2,t:tx("Práctica implementada sin resultados medibles","Practice in place without measurable results"),d:tx(`${list(noRes.map(s=>ts(s.tool)))} alcanzan Nivel ≥ 2 pero su ejecución es < 50 %. Verificar que la práctica se use de verdad y medir el indicador en el tablero del área.`,`${list(noRes.map(s=>ts(s.tool)))} reach Level ≥ 2 but execution is < 50%. Verify the practice is really used and track the indicator on the area board.`)});
  const kq=st.filter(s=>s.quiz!=null&&s.quiz<0.6);
  if(kq.length)R.push({p:2,t:tx("Reforzar conocimiento","Reinforce knowledge"),d:tx(`El cuestionario muestra < 60 % de aciertos en ${list(kq.map(s=>ts(s.tool)))}. Reforzar con práctica en gemba y lecciones de un punto.`,`The questionnaire shows < 60% correct answers in ${list(kq.map(s=>ts(s.tool)))}. Reinforce with gemba practice and one-point lessons.`)});
  R.push({p:2,t:tx("Enfoque ETO para las herramientas prioritarias","ETO focus for priority tools"),d:prio.map(s=>`<b>${esc(ts(s.tool))}:</b> ${esc(eto(s.tool))}`).join("<br>"),html:true});
  const vsm=st.find(s=>s.tool.startsWith("VSM"));
  if(vsm&&vsm.level<2)R.push({p:2,t:tx("Mapear el flujo de valor de la orden al embarque","Map the value stream from order to shipment"),d:tx("En ETO la mayor parte del tiempo de entrega ocurre antes del piso (ingeniería, liberación de planos, compras). Un VSM order-to-cash de una familia representativa ubica la restricción real y prioriza el roadmap (Cannas & Gosling, 2021; Rother & Shook, 1999).","In ETO most lead time happens before the floor (engineering, drawing release, purchasing). An order-to-cash VSM of a representative family locates the real constraint and prioritizes the roadmap (Cannas & Gosling, 2021; Rother & Shook, 1999).")});
  if(base){const sb=allStats(base);const up=st.filter((s,i)=>s.level>sb[i].level),flat=st.filter((s,i)=>s.level===sb[i].level&&s.level<2);
    R.push({p:2,t:tx("Lectura del avance","Progress reading"),d:tx(`Desde «${evLabel(base)}»: ${up.length} herramienta(s) subieron de nivel${up.length?` (${list(up.map(s=>ts(s.tool)))})`:''}. ${flat.length?`Sin avance y aún bajo Nivel 2: ${list(flat.map(s=>ts(s.tool)))}.`:''}`,`Since "${evLabel(base)}": ${up.length} tool(s) moved up${up.length?` (${list(up.map(s=>ts(s.tool)))})`:''}. ${flat.length?`No progress and still below Level 2: ${list(flat.map(s=>ts(s.tool)))}.`:''}`)})}
  R.push({p:3,t:tx("Gobierno del roadmap","Roadmap governance"),d:tx("Revisar el roadmap cada semana en la junta de arranque o en el recorrido del liderazgo; un dueño por herramienta; reevaluar a los 90 días con evidencia en gemba. Mantener el enfoque centrado en las personas: los asociados proponen y ejecutan las mejoras (Breque et al., 2021; Shingo Institute, 2020).","Review the roadmap weekly at the start-up meeting or leadership walk; one owner per tool; reassess at 90 days with gemba evidence. Keep a human-centric approach: associates propose and carry out improvements (Breque et al., 2021; Shingo Institute, 2020).")});
  return {R,avg,prio};
}

function getBase(e){const others=S.evals.filter(x=>x.id!==e.id);return S.evals.find(x=>x.id===S.base&&x.id!==e.id)||others.find(x=>areaName(x)===areaName(e)&&x.momento==="Inicial"&&!!x.demo===!!e.demo)||null}

/* ======================= ACTIONS ======================= */
function setLang(l){S.lang=l;save();render();if(TOUR.on)tourShow()}
function setF(k,v,quiet){const e=E();e[k]=v;save();if(!quiet)render();else{renderSide();renderHeader()}}
function setS(code,k,v){
  const e=E();const p=PBYCODE[code];e.scores[code]=e.scores[code]||{};
  if(v===1){const b=prevBlock(e,p,k);if(b){toast(tx(`🔒 Primero debe cumplirse el Nivel ${b} de esta práctica.`,`🔒 Level ${b} of this practice must be met first.`));return}}
  if(e.scores[code][k]===v)delete e.scores[code][k];else e.scores[code][k]=v;
  const n=enforceSeq(e,p);if(n)toast(tx(`Se reiniciaron ${n} nivel(es) superior(es) a «No» por la regla secuencial.`,`${n} higher level(s) were reset to 'No' by the sequential rule.`));
  save();rerenderKeep();
}
function setEv(code,v){E().evid[code]=v;save()}
function setM(code,p){const e=E();e.metrics[code]=e.metrics[code]||{};e.metrics[code].pts=p;save();rerenderKeep()}
function setMD(code,v){const e=E();e.metrics[code]=e.metrics[code]||{};e.metrics[code].dato=v;save()}
function setQ(i,f,v){const e=E();e.quiz[i]=e.quiz[i]||{};e.quiz[i][f]=v===''?null:Math.max(0,+v);save();rerenderKeep()}
function setMeta(i,v){const e=E();const tl=DATA.tools[i];if(v)e.meta[tl]=+v;else delete e.meta[tl];save();rerenderKeep()}
function metaPlus1(){const e=E();allStats(e).forEach(s=>{e.meta[s.tool]=Math.min(s.max,s.level+1)});save();render();toast(tx("Metas sugeridas: nivel actual + 1","Suggested targets: current level + 1"))}
function setR(code,f,v){const e=E();e.road[code]=e.road[code]||{};e.road[code][f]=v;save();if(f==='estado')rerenderKeep()}
function setActive(id){S.active=id;save();render()}
function addEval(){const e=newEval();S.evals.push(e);S.active=e.id;save();go('datos');toast(tx("Nueva evaluación creada","New assessment created"))}
function dupEval(id){const src=S.evals.find(x=>x.id===id);const c=JSON.parse(JSON.stringify(src));c.id=uid();c.momento=src.momento==="Inicial"?"Final":src.momento;c.fecha=today();c.creado=Date.now();S.evals.push(c);S.base=src.id;S.active=c.id;save();render();toast(tx("Duplicada: actualice las calificaciones con la nueva evidencia","Duplicated: update ratings with the new evidence"))}
function delEval(id){if(S.evals.length===1){toast(tx("Debe quedar al menos una evaluación","At least one assessment must remain"));return}if(!confirm(tx("¿Eliminar esta evaluación?","Delete this assessment?")))return;S.evals=S.evals.filter(x=>x.id!==id);if(S.active===id)S.active=S.evals[0].id;save();render()}

/* ======================= XLSX IMPORT ======================= */
async function unzip(buf){
  const dv=new DataView(buf);let eocd=-1;for(let i=buf.byteLength-22;i>=Math.max(0,buf.byteLength-66000);i--){if(dv.getUint32(i,true)===0x06054b50){eocd=i;break}}
  if(eocd<0)throw new Error("zip");const n=dv.getUint16(eocd+10,true);let off=dv.getUint32(eocd+16,true);const files={};const dec=new TextDecoder();
  for(let k=0;k<n;k++){const meth=dv.getUint16(off+10,true),csz=dv.getUint32(off+20,true),nl=dv.getUint16(off+28,true),el=dv.getUint16(off+30,true),cl=dv.getUint16(off+32,true),lo=dv.getUint32(off+42,true);files[dec.decode(new Uint8Array(buf,off+46,nl))]={meth,csz,lo};off+=46+nl+el+cl}
  async function read(name){const f=files[name];if(!f)return null;const ln=dv.getUint16(f.lo+26,true),le=dv.getUint16(f.lo+28,true);const data=new Uint8Array(buf,f.lo+30+ln+le,f.csz);if(f.meth===0)return dec.decode(data);const s=new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"));return await new Response(s).text()}
  return {read};
}
async function importXlsx(file){
  try{
    const z=await unzip(await file.arrayBuffer());const P=new DOMParser();
    const wb=P.parseFromString(await z.read("xl/workbook.xml"),"application/xml");const rel=P.parseFromString(await z.read("xl/_rels/workbook.xml.rels"),"application/xml");
    const rmap={};[...rel.getElementsByTagName("Relationship")].forEach(r=>rmap[r.getAttribute("Id")]=r.getAttribute("Target"));
    const ssx=await z.read("xl/sharedStrings.xml");const SS=[];if(ssx){const d=P.parseFromString(ssx,"application/xml");[...d.getElementsByTagName("si")].forEach(si=>SS.push([...si.getElementsByTagName("t")].map(x=>x.textContent).join("")))}
    const sheets={};
    for(const s of [...wb.getElementsByTagName("sheet")]){const rid=s.getAttribute("r:id")||s.getAttributeNS("http://schemas.openxmlformats.org/officeDocument/2006/relationships","id");let tg=rmap[rid];if(!tg)continue;tg=tg.replace(/^\/?xl\//,"");const x=await z.read("xl/"+tg);if(!x)continue;
      const d=P.parseFromString(x,"application/xml");const cells={};[...d.getElementsByTagName("c")].forEach(c=>{const r=c.getAttribute("r"),ty=c.getAttribute("t");let v=null;const ve=c.getElementsByTagName("v")[0];if(ty==="s"&&ve)v=SS[+ve.textContent];else if(ty==="inlineStr")v=[...c.getElementsByTagName("t")].map(y=>y.textContent).join("");else if(ty==="str"&&ve)v=ve.textContent;else if(ve)v=+ve.textContent;cells[r]=v});sheets[s.getAttribute("name")]=cells}
    const e=newEval();const ini=sheets["Inicio"]||{};const lab={};Object.keys(ini).forEach(r=>{if(r.startsWith("B"))lab[ini[r]]=ini["C"+r.slice(1)]});
    const ar=lab["Área / flujo de valor evaluado"];if(ar){const m=AREAS.find(a=>String(ar).toLowerCase().includes(a.toLowerCase()));if(m&&m!=="Otra")e.area=m;else{e.area="Otra";e.areaOtra=String(ar)}}
    if(lab["Equipo evaluador"])e.equipo=String(lab["Equipo evaluador"]);if(lab["Facilitador"])e.facilitador=String(lab["Facilitador"]);if(lab["Momento de la evaluación"])e.momento=String(lab["Momento de la evaluación"]);
    const f=lab["Fecha"];if(typeof f==="number")e.fecha=new Date(Math.round((f-25569)*864e5)).toISOString().slice(0,10);else if(f)e.fecha=String(f).slice(0,10);
    const u=lab["Umbral para alcanzar un nivel"];if(typeof u==="number"&&u>0&&u<=1)e.umbral=u;
    let nS=0,nM=0;
    Object.values(sheets).forEach(cells=>{Object.keys(cells).filter(r=>/^A\d+$/.test(r)).forEach(r=>{const code=cells[r];const row=r.slice(1);
      if(PBYCODE[code]){const p=PBYCODE[code];[[1,"E"],[2,"G"],[3,"I"],[4,"K"]].forEach(([k,col])=>{if(!(k in p.crit))return;const v=cells[col+row];if(v===1||v===0||v==="NA"){e.scores[code]=e.scores[code]||{};e.scores[code][k]=v;nS++}});if(cells["M"+row])e.evid[code]=String(cells["M"+row])}
      else if(MBYCODE[code]){const v=cells["L"+row];if(typeof v==="number"){e.metrics[code]={pts:v,dato:cells["M"+row]?String(cells["M"+row]):""};nM++}}})});
    const res=sheets["Resultados"]||{};Object.keys(res).filter(r=>/^A\d+$/.test(r)).forEach(r=>{const tl=res[r];if(DATA.tools.includes(tl)){const m=res["S"+r.slice(1)];if(typeof m==="number"&&m>=1&&m<=4)e.meta[tl]=m}});
    const rm=sheets["Roadmap"]||{};Object.keys(rm).filter(r=>/^B\d+$/.test(r)).forEach(r=>{const code=rm[r];if(!PBYCODE[code])return;const row=r.slice(1);const o={};[["accion","I"],["resp","J"],["fecha","K"],["evid","L"],["estado","M"]].forEach(([k,c])=>{let v=rm[c+row];if(v==null||v==="")return;if(k==="fecha"&&typeof v==="number")v=new Date(Math.round((v-25569)*864e5)).toISOString().slice(0,10);o[k]=String(v)});if(Object.keys(o).length)e.road[code]=o});
    const q=sheets["Cuestionario"]||{};Object.keys(q).filter(r=>/^D\d+$/.test(r)).forEach(r=>{const i=DATA.quiz.findIndex(x=>x.q===q[r]);if(i<0)return;const row=r.slice(1);let ok=0,n=0;for(let c=6;c<=17;c++){const v=q[String.fromCharCode(64+c)+row];if(v===0||v===1){n++;ok+=v}}if(n)e.quiz[i]={ok,n}});
    let fixed=0;PRACT.forEach(p=>{if(e.scores[p.code])fixed+=enforceSeq(e,p)});
    S.evals.push(e);S.active=e.id;save();render();toast(tx(`Excel importado: ${nS} criterios y ${nM} métricas`,`Excel imported: ${nS} criteria and ${nM} metrics`)+(fixed?tx(` · ${fixed} ajuste(s) por regla secuencial`,` · ${fixed} adjustment(s) by sequential rule`):''));
  }catch(err){console.error(err);alert(tx("No se pudo leer el Excel. Verifique que sea el archivo del instrumento (.xlsx) y use Edge o Chrome actualizados.","Could not read the Excel file. Make sure it is the instrument file (.xlsx) and use an up-to-date Edge or Chrome."))}
}

function rng(seed){let s=seed;return()=>{s=(s*16807)%2147483647;return(s-1)/2147483646}}
function makeDemo(){
  S.evals=S.evals.filter(x=>!x.demo);
  const r=rng(42);const a=newEval({demo:true,area:"Switchboards",equipo:tx("Equipo demo","Demo team"),momento:"Inicial",fecha:"2026-11-19"});
  const pr=[0.8,0.45,0.15,0.05];
  PRACT.forEach(p=>{a.scores[p.code]={};let ok=true;for(let k=1;k<=4;k++){if(!(k in p.crit))continue;const v=ok&&r()<pr[k-1]?1:0;a.scores[p.code][k]=v;if(!v)ok=false}});
  a.evid["VS-01"]=tx("VSM de tableros autosoportados (oct 2026), estado actual en pizarrón del área","Free-standing switchboard VSM (Oct 2026), current state on area whiteboard");
  METR.forEach(m=>{a.metrics[m.code]={pts:m.opts[Math.floor(r()*Math.min(3,m.opts.length))][1],dato:""}});
  DATA.quiz.forEach((q,i)=>{const n=8;a.quiz[i]={n,ok:Math.floor(3+r()*6)}});
  allStats(a).forEach(s=>{a.meta[s.tool]=Math.min(s.max,s.level+1)});
  const req=roadRows(a).filter(x=>x.req==="Sí").slice(0,5);
  const who=["Supervisor Switchboards","Ing. Manufactura","Líder de celda","Mantenimiento","Calidad"];
  req.forEach((x,i)=>{a.road[x.p.code]={accion:tx("Definir estándar y aplicarlo en la celda piloto","Define the standard and apply it in the pilot cell"),resp:who[i],fecha:"2026-12-15",estado:i<2?"En proceso":"Pendiente"}});
  const b=JSON.parse(JSON.stringify(a));b.id=uid();b.momento="Final";b.fecha="2027-02-19";b.creado=Date.now()+1;
  PRACT.forEach(p=>{let ok=true;for(let k=1;k<=4;k++){if(!(k in p.crit))continue;let v=b.scores[p.code][k];if(ok&&v!==1&&r()<0.5)v=1;if(!ok)v=0;b.scores[p.code][k]=v;if(v!==1)ok=false}});
  req.forEach(x=>{b.road[x.p.code].estado="Cerrado"});
  S.evals.push(a,b);S.active=b.id;S.base=a.id;save();
}

   <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px"><div class="rp-msg" style="background:#eef7ef"><b>${tx("Fortalezas","Strengths")}</b><br>${top.map(s=>`<span class="row" style="gap:6px;flex-wrap:nowrap;margin-top:4px">${icon(s.tool,14,'#2f9e44')}<span class="lv lv${s.level}" style="height:18px;min-width:22px;font-size:10px">${s.level}</span> ${esc(tn(s.tool))} · ${Math.round(s.pct*100)} %</span>`).join("")}</div>
    <div class="rp-msg" style="background:#fdeeee"><b>${tx("Prioridades de mejora (90 días)","Improvement priorities (90 days)")}</b><br>${prio.map(s=>`<span class="row" style="gap:6px;flex-wrap:nowrap;margin-top:4px">${icon(s.tool,14)}<span class="lv lv${s.level}" style="height:18px;min-width:22px;font-size:10px">${s.level}</span> ${esc(tn(s.tool))}${s.meta?` → ${N(s.meta)}`:''} · ${tx("faltan","missing")} ${s.pend}</span>`).join("")}</div></div>
   <p class="rp-small" style="margin-top:8px">${tx("Escala","Scale")}: ${[0,1,2,3,4].map(k=>`${k} ${lvn(k)}`).join(" · ")}. ${tx("Umbral","Threshold")}: ${Math.round(e.umbral*100)} %. ${tx("Regla secuencial aplicada por práctica.","Sequential rule applied per practice.")}</p>
   ${rpFoot(++pg,e)}</div>`);
  P.push(`<div class="rp-page">${rpBand(tx("Madurez por herramienta","Maturity by tool"),tx("Cumplimiento de criterios por nivel, nivel alcanzado, meta y ejecución","Criteria met by level, level reached, target and execution"))}${heatTable(e)}
   <div class="legend" style="margin-top:6px"><span><i style="background:#2f9e44"></i>≥ ${tx("umbral","threshold")} (${Math.round(e.umbral*100)} %)</span><span><i style="background:#f5a524"></i>50 % – ${tx("umbral","threshold")}</span><span><i style="background:#f28b82"></i>&lt; 50 %</span><span><i style="background:#e9ecf1"></i>0 %</span></div>${rpFoot(++pg,e)}</div>`);
  P.push(`<div class="rp-page">${rpBand(tx("Recomendaciones","Recommendations"),tx("Priorizadas por base de estabilidad, brecha a la meta y entorno ETO","Prioritized by stability foundation, gap to target and ETO environment"))}
   ${R.map((r,i)=>`<div class="reco ${r.p===1?'p1':''}"><h4>${i+1}. ${esc(r.t)}</h4><p>${r.html?r.d:esc(r.d)}</p></div>`).join("")}${rpFoot(++pg,e)}</div>`);
  const quick=st.filter(s=>s.level<s.max&&s.pend>0&&s.pend<=2);
  P.push(`<div class="rp-page">${rpBand(tx("Avance y plan de 90 días","Progress and 90-day plan"),tx("Comparación entre mediciones y ruta de implementación","Comparison between measurements and implementation path"))}
   ${base?`<h2>${tx("Avance","Progress")}: ${esc(mom(base.momento))} (${fmtDate(base.fecha)}) vs. ${esc(mom(e.momento))} (${fmtDate(e.fecha)})</h2><div class="svgbox">${groupedSVG(allStats(base).map(x=>x.level),st.map(x=>x.level),mom(base.momento),mom(e.momento),{w:980,h:300})}</div>
    <table class="t" style="margin-top:6px"><thead><tr><th>${tx("Indicador","Indicator")}</th><th class="c">${esc(mom(base.momento))}</th><th class="c">${esc(mom(e.momento))}</th><th class="c">${tx("Cambio","Change")}</th></tr></thead><tbody>
    ${(()=>{const sb=allStats(base);const row=(l,a,b,f)=>`<tr><td>${l}</td><td class="c">${f(a)}</td><td class="c"><b>${f(b)}</b></td><td class="c">${(b-a>=0?'+':'')+f(b-a)}</td></tr>`;const pc=x=>x.reduce((s,y)=>s+y.pct,0)/14;
      return row(tx("Nivel promedio (0–4)","Average level (0–4)"),avgLevel(base),avg,v=>v.toFixed(1))+row(tx("Herramientas en Nivel ≥ 2","Tools at Level ≥ 2"),sb.filter(x=>x.level>=2).length,n2,v=>String(v))+row(tx("Cumplimiento promedio de criterios","Average criteria met"),pc(sb)*100,pc(st)*100,v=>Math.round(v)+" %")})()}</tbody></table>`
   :`<h2>${tx("Avance","Progress")}</h2><p class="rp-msg">${tx("Aún no hay una medición previa. Al reevaluar a los 90 días esta página mostrará el avance por herramienta.","No previous measurement yet. When reassessing at 90 days this page will show progress by tool.")}</p>`}
   <h2>${tx("Plan 30-60-90 días","30-60-90 day plan")}</h2>
   <table class="t"><thead><tr><th style="width:90px">${tx("Horizonte","Horizon")}</th><th>${tx("Enfoque","Focus")}</th><th>${tx("Entregable","Deliverable")}</th></tr></thead><tbody>
    <tr><td><b>${tx("30 días","30 days")}</b></td><td>${quick.length?tx("Victorias rápidas","Quick wins")+": "+quick.map(s=>ts(s.tool)).join(", "):tx("Cerrar criterios de Nivel 1 en herramientas de estabilidad","Close Level 1 criteria in stability tools")}</td><td>${tx("Criterios cerrados con evidencia; dueño por herramienta","Criteria closed with evidence; owner per tool")}</td></tr>
    <tr><td><b>${tx("60 días","60 days")}</b></td><td>${tx("Herramientas prioritarias","Priority tools")}: ${prio.map(s=>ts(s.tool)).join(", ")}</td><td>${tx("Roadmap con acción definida","Roadmap with action defined")}: ${conAcc}/${req.length} → 100 %</td></tr>
    <tr><td><b>${tx("90 días","90 days")}</b></td><td>${tx("Reevaluación con este instrumento y ajuste de metas","Reassessment with this instrument and target adjustment")}</td><td>${tx("Reporte de avance inicial vs. final y nuevo roadmap","Initial vs. final progress report and new roadmap")}</td></tr></tbody></table>${rpFoot(++pg,e)}</div>`);
  const areasC={};S.evals.forEach(x=>{const a=areaName(x);if(!areasC[a]||later(x,areasC[a]))areasC[a]=x});const AC=Object.values(areasC);
  if(AC.length>1)P.push(`<div class="rp-page">${rpBand(tx("Consolidado de planta","Plant roll-up"),tx("Nivel por herramienta en cada área (última evaluación por área)","Level by tool in each area (latest assessment per area)"))}
   <table class="t heat"><thead><tr><th>${tx("Herramienta","Tool")}</th>${AC.map(x=>`<th class="c">${esc(areaName(x))}<br><span style="font-weight:400">${esc(mom(x.momento))}</span></th>`).join("")}</tr></thead><tbody>${DATA.tools.map(x=>`<tr><td><span class="row" style="gap:6px;flex-wrap:nowrap">${icon(x,13)}${esc(ts(x))}</span></td>${AC.map(y=>{const v=toolStats(y,x).level;return `<td class="h" style="background:${LVCOL[v]}">${v}</td>`}).join("")}</tr>`).join("")}<tr><td><b>${tx("Promedio","Average")}</b></td>${AC.map(x=>`<td class="c"><b>${avgLevel(x).toFixed(1)}</b></td>`).join("")}</tr></tbody></table>${rpFoot(++pg,e)}</div>`);

    const chunks=[];let cur=[],lines=0;flat.forEach(x=>{const w=x.h?2:Math.ceil((x.crit||'').length/70)+1.2;if(lines+w>38&&cur.length){chunks.push(cur);cur=[];lines=0}cur.push(x);lines+=w});if(cur.length)chunks.push(cur);if(!chunks.length)chunks.push([]);
    const stt=v=>({"Pendiente":tx("Pendiente","Pending"),"En proceso":tx("En proceso","In progress"),"Cerrado":tx("Cerrado","Closed")}[v]||tx("Pendiente","Pending"));
    chunks.forEach((ch,ci)=>P.push(`<div class="rp-page">${rpBand(tx("Anexo · Roadmap para equipos","Appendix · Team roadmap")+(chunks.length>1?` (${ci+1}/${chunks.length})`:''),tx("Criterios requeridos para alcanzar el nivel meta","Criteria required to reach the target level"))}
      ${ch.length?`<table class="t"><thead><tr><th>${tx("Práctica","Practice")}</th><th class="c">${tx("Nivel","Level")}</th><th style="width:38%">${tx("Criterio a lograr","Criterion to achieve")}</th><th>${tx("Acción","Action")}</th><th>${tx("Resp.","Owner")}</th><th>${tx("Fecha","Date")}</th><th>${tx("Estado","Status")}</th></tr></thead><tbody>
      ${ch.map(x=>x.h?`<tr><td colspan="7" style="background:#eef1f6;font-weight:700;color:#1F2A44"><span class="row" style="gap:6px">${icon(x.h,14)}${esc(tn(x.h))}</span></td></tr>`:`<tr><td>${x.p.code} · ${esc(pname(x.p))}</td><td class="c">${x.lv}→${x.nx}</td><td>${esc(x.crit)}</td><td>${esc(x.r.accion||'—')}</td><td>${esc(x.r.resp||'—')}</td><td>${x.r.fecha?fmtDate(x.r.fecha):'—'}</td><td>${stt(x.r.estado)}</td></tr>`).join("")}</tbody></table>`:`<p>${tx("No hay criterios requeridos: capture el nivel meta en Resultados.","No required criteria: enter the target level in Results.")}</p>`}${rpFoot(++pg,e)}</div>`))}
  if(refs)P.push(`<div class="rp-page">${rpBand(tx("Metodología y referencias","Methodology and references"),tx("Base conceptual del instrumento","Conceptual basis of the instrument"))}
    <p><b>${tx("Instrumento.","Instrument.")}</b> ${tx(`Modelo de madurez por herramienta derivado del OpEx Site Assessment de J. Vázquez Hernández: ${PRACT.length} prácticas, ${TOTALCRIT} criterios por nivel y ${METR.length} métricas de ejecución en 14 herramientas Lean. El nivel de cada herramienta es el último nivel consecutivo en el que se cumple el umbral (${Math.round(e.umbral*100)} %); dentro de cada práctica aplica la regla secuencial.`,`Tool maturity model derived from J. Vázquez Hernández's OpEx Site Assessment: ${PRACT.length} practices, ${TOTALCRIT} criteria by level and ${METR.length} execution metrics across 14 Lean tools. Each tool's level is the last consecutive level where the threshold (${Math.round(e.umbral*100)}%) is met; within each practice the sequential rule applies.`)}</p>
    <p><b>${tx("Niveles.","Levels.")}</b> ${tx("La lógica por etapas sigue al Capability Maturity Model (Paulk et al., 1993) y a los modelos de madurez Lean a nivel operativo (Maasouman & Demirli, 2016; Chong & Perumal, 2022). La progresión herramientas → sistemas → principios y cultura corresponde al Modelo Shingo (Plenert, 2018; Shingo Institute, 2020). El Nivel 4 incorpora la Excelencia Operacional 5.0: centrada en las personas, sostenible y resiliente (Breque et al., 2021; Kaswan et al., 2024; Jamwal et al., 2026).","The staged logic follows the Capability Maturity Model (Paulk et al., 1993) and operational-level lean maturity models (Maasouman & Demirli, 2016; Chong & Perumal, 2022). The tools → systems → principles and culture progression corresponds to the Shingo Model (Plenert, 2018; Shingo Institute, 2020). Level 4 incorporates Operational Excellence 5.0: human-centric, sustainable and resilient (Breque et al., 2021; Kaswan et al., 2024; Jamwal et al., 2026).")}</p>
    <p><b>ETO.</b> ${tx("Los criterios se ajustaron a manufactura bajo pedido con ingeniería: takt por contenido de trabajo, kanban solo en componentes comunes, VSM de la orden al cobro y escalamiento de problemas de ingeniería (Gosling & Naim, 2009; Cannas & Gosling, 2021; Schulze & Dallasega, 2021; Galhardo, 2019).","Criteria were adjusted to engineer-to-order manufacturing: takt by work content, kanban only for common components, order-to-cash VSM and escalation of engineering problems (Gosling & Naim, 2009; Cannas & Gosling, 2021; Schulze & Dallasega, 2021; Galhardo, 2019).")}</p>
    <h2>${tx("Referencias","References")}</h2>${REFS.map(r=>`<p style="padding-left:24px;text-indent:-24px;margin:0 0 6px;font-size:10.5px">${esc(r)}</p>`).join("")}${rpFoot(++pg,e)}</div>`);
  const html=P.join("");document.getElementById("report").innerHTML=html;const pv=document.getElementById("preview");if(pv)pv.innerHTML=html;
}
function printReport(){buildReport();const pv=document.getElementById("preview");if(pv)pv.innerHTML="";setTimeout(()=>{window.print();setTimeout(()=>buildReport(),300)},50)}
render();
