<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modelo de Madurez Lean Tools · ABB MTY 1.0</title>
<meta name="description" content="Instrumento de autoevaluación de madurez de 14 herramientas Lean para ABB Planta MTY 1.0 (entorno ETO).">
<style>
:root{
  --navy:#1F2A44; --navy2:#2E3B5E; --red:#FF000F; --red2:#C8102E; --ink:#1d2433; --muted:#5b6475;
  --line:#e3e6ec; --bg:#f6f7f9; --card:#fff; --soft:#f1f3f7; --input:#fff8e1;
  --l0:#b8bec9; --l1:#e5484d; --l2:#f5a524; --l3:#9bc53d; --l4:#2f9e44;
  --ok:#2f9e44; --no:#e5484d; --na:#8a94a6;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Segoe UI",Arial,Helvetica,sans-serif;color:var(--ink);background:var(--bg);font-size:14px;line-height:1.45}
button{font-family:inherit;font-size:13px;cursor:pointer}
button:disabled{cursor:not-allowed}
input,select,textarea{font-family:inherit;font-size:13px}
a{color:var(--navy2)}
.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;display:flex;align-items:center;gap:16px;padding:8px 22px;box-shadow:0 2px 8px rgba(0,0,0,.15);height:62px}
.brand{display:flex;align-items:center;gap:14px}
.logo{background:#fff;border-radius:6px;padding:5px 9px;display:flex;align-items:center}
.logo img{height:26px;display:block}
.brand .t1{font-weight:700;font-size:16px}
.brand .t2{font-size:12px;opacity:.8}
.top .sp{flex:1}
.evalpick{display:flex;align-items:center;gap:8px;font-size:12px}
.evalpick select{max-width:280px;padding:5px 8px;border-radius:6px;border:0}
.langsw{display:flex;border:1px solid rgba(255,255,255,.5);border-radius:7px;overflow:hidden}
.langsw button{background:transparent;color:#fff;border:0;padding:5px 10px;font-weight:700;font-size:12px}
.langsw button.on{background:#fff;color:var(--navy)}
.demobtn{background:var(--red);color:#fff;border:0;border-radius:7px;padding:7px 12px;font-weight:700;font-size:12px}
.jvh{text-align:right;font-size:11px;opacity:.85;line-height:1.2}
.jvh b{font-size:13px;opacity:1;letter-spacing:.5px}
.wrap{display:grid;grid-template-columns:250px 1fr;min-height:calc(100vh - 62px)}
.side{background:#fff;border-right:1px solid var(--line);padding:16px 12px;position:sticky;top:62px;height:calc(100vh - 62px);overflow:auto}
.step{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;color:var(--ink);cursor:pointer;margin-bottom:2px;user-select:none}
.step:hover{background:var(--soft)}
.step.on{background:var(--navy);color:#fff}
.step .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--soft);color:var(--navy);flex:none}
.step.on .n{background:var(--red);color:#fff}
.step .lb{font-size:13px;font-weight:600}
.step .sb{font-size:11px;opacity:.7}
.sidebox{margin-top:14px;padding:12px;border-radius:10px;background:var(--soft);font-size:12px;color:var(--muted)}
.prog{height:8px;background:#e1e5ec;border-radius:6px;overflow:hidden;margin:6px 0}
.prog>i{display:block;height:100%;background:linear-gradient(90deg,var(--red2),var(--red))}
main{padding:24px 30px 60px;max-width:1400px}
h1{font-size:24px;margin:0 0 4px;color:var(--navy)}
h2{font-size:18px;margin:26px 0 10px;color:var(--navy)}
h3{font-size:15px;margin:16px 0 8px;color:var(--navy)}
.lead{color:var(--muted);margin:0 0 18px;max-width:950px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;border-top:4px solid var(--navy)}
.kpi .v{font-size:28px;font-weight:800;color:var(--navy)}
.kpi .l{font-size:12px;color:var(--muted)}
.btn{border:1px solid var(--navy);background:#fff;color:var(--navy);padding:8px 14px;border-radius:8px;font-weight:600}
.btn:hover{background:var(--soft)}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff}
.btn.pri:hover{background:var(--red2)}
.btn.dk{background:var(--navy);color:#fff}
.btn.sm{padding:5px 10px;font-size:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{padding:8px 10px;border:1px solid #cfd5df;border-radius:8px;background:var(--input)}
.help{font-size:12px;color:var(--muted)}
.pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700;background:var(--soft);color:var(--navy)}
.lv{display:inline-grid;place-items:center;min-width:30px;height:26px;padding:0 8px;border-radius:6px;font-weight:800;color:#fff}
.lv0{background:var(--l0)}.lv1{background:var(--l1)}.lv2{background:var(--l2)}.lv3{background:var(--l3)}.lv4{background:var(--l4)}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{background:var(--navy);color:#fff;font-weight:600;padding:8px;text-align:left;font-size:12px}
table.t td{border-bottom:1px solid var(--line);padding:7px 8px;vertical-align:top}
table.t tr:hover td{background:#fafbfd}
.c{text-align:center}
.toast{position:fixed;bottom:20px;right:20px;background:var(--navy);color:#fff;padding:10px 16px;border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.2);opacity:0;transition:.3s;z-index:9999;max-width:420px}
.toast.show{opacity:1}
.ico{display:inline-grid;place-items:center;flex:none}
.ico svg{display:block}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.tchip{border:1px solid var(--line);background:#fff;border-radius:22px;padding:5px 12px 5px 6px;font-size:12px;display:flex;gap:7px;align-items:center}
.tchip .ico{width:24px;height:24px;border-radius:50%;background:var(--soft)}
.tchip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.tchip.on .ico{background:#fff}
.tchip .dot{width:8px;height:8px;border-radius:50%}
.thead{display:flex;gap:16px;align-items:center}
.thead .big{width:58px;height:58px;border-radius:14px;background:linear-gradient(135deg,#fff0f1,#ffe0e3);display:grid;place-items:center}
.pcard{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:14px;overflow:hidden}
.phead{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--soft)}
.phead .code{font-size:11px;font-weight:700;color:var(--muted)}
.phead .nm{font-weight:700;color:var(--navy);flex:1}
.levels{display:grid;grid-template-columns:repeat(4,1fr)}
.lvcell{border-right:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:8px;min-height:120px;position:relative}
.lvcell:last-child{border-right:0}
.lvcell .lh{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.4px}
.lvcell .tx{font-size:12.5px;flex:1}
.lvcell.na{background:repeating-linear-gradient(45deg,#fafafa,#fafafa 6px,#f2f2f2 6px,#f2f2f2 12px);color:#9aa3b2;font-size:12px;justify-content:center;align-items:center}
.lvcell.locked .tx{color:#9aa3b2}
.lvcell .lock{font-size:11px;color:#9a6b00;background:#fff4d6;border-radius:6px;padding:3px 7px}
.seg{display:flex;border:1px solid #cfd5df;border-radius:8px;overflow:hidden}
.seg button{flex:1;border:0;background:#fff;padding:6px 4px;font-size:12px;font-weight:700;color:var(--muted)}
.seg button+button{border-left:1px solid #cfd5df}
.seg button:disabled{background:#f3f4f6;color:#c3c8d1}
.seg button.s1{background:var(--ok);color:#fff}
.seg button.s0{background:var(--no);color:#fff}
.seg button.sna{background:var(--na);color:#fff}
.lvcell.met{background:#f0f9f1}
.pfoot{padding:8px 14px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center}
.pfoot input{flex:1;padding:7px 10px;border:1px solid #cfd5df;border-radius:8px;background:var(--input)}
.eto{border-left:4px solid var(--red);background:#fff5f5;padding:10px 14px;border-radius:0 8px 8px 0;font-size:13px;margin-bottom:14px}
.rule{border-left:4px solid var(--navy);background:#eef2fa;padding:10px 14px;border-radius:0 8px 8px 0;font-size:13px;margin-bottom:14px}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opt{border:1px solid #cfd5df;border-radius:8px;padding:6px 10px;font-size:12px;background:#fff}
.opt.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.opt b{margin-left:6px}
.heat td.h{text-align:center;font-weight:700;color:#fff;border:2px solid #fff}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:14px;height:14px;border-radius:3px;display:inline-block}
.svgbox svg{width:100%;height:auto}
.foot{margin-top:40px;padding-top:12px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}
.dropzone{border:2px dashed #c3cad6;border-radius:12px;padding:18px;text-align:center;color:var(--muted);background:#fff}
.dropzone.drag{border-color:var(--red);background:#fff5f5}
.evlist .ev{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:#fff}
.evlist .ev.on{border-color:var(--red);box-shadow:0 0 0 2px #ffd6d8}
.evlist .ev .meta{flex:1;font-size:12px;color:var(--muted)}
.evlist .ev .meta b{color:var(--ink);font-size:14px}
.stepsguide{counter-reset:s;list-style:none;padding:0;margin:0}
.stepsguide li{counter-increment:s;position:relative;padding:9px 12px 9px 50px;border-bottom:1px solid var(--line)}
.stepsguide li:before{content:counter(s);position:absolute;left:10px;top:9px;width:28px;height:28px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:800}
.reco{border-left:4px solid var(--navy);padding:8px 12px;margin-bottom:10px;background:#fff;border-radius:0 8px 8px 0}
.reco.p1{border-color:var(--red)}
.reco h4{margin:0 0 4px;font-size:14px;color:var(--navy)}
.reco p{margin:0;font-size:13px}
.copyright{font-size:11px;color:var(--muted)}
.hero{background:linear-gradient(120deg,var(--navy) 0%,#2b3a63 70%,#3b1f33 100%);color:#fff;border-radius:16px;padding:22px 26px;margin-bottom:18px;display:flex;gap:20px;align-items:center}
.hero h1{color:#fff}
.hero p{margin:4px 0 0;opacity:.9;max-width:760px}
.hero .icons{display:grid;grid-template-columns:repeat(7,34px);gap:8px;margin-left:auto}
.hero .icons .ico{width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.12)}
.gl{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.gl .g{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.gl .g b{color:var(--navy);font-size:14px}
.gl .g .alt{font-size:11px;color:var(--muted);margin-left:6px}
.gl .g p{margin:6px 0 0;font-size:13px}
/* tour */
#tourShade{position:fixed;inset:0;z-index:5000;display:none}
#tourSpot{position:fixed;z-index:5001;border-radius:10px;box-shadow:0 0 0 9999px rgba(15,20,35,.62);transition:all .25s ease;pointer-events:none;outline:3px solid var(--red)}
#tourCard{position:fixed;z-index:5002;width:380px;background:#fff;border-radius:14px;box-shadow:0 18px 40px rgba(0,0,0,.35);padding:16px 18px;transition:top .25s,left .25s}
#tourCard .k{font-size:11px;font-weight:800;color:var(--red);letter-spacing:.5px;text-transform:uppercase}
#tourCard h3{margin:4px 0 6px}
#tourCard p{margin:0 0 12px;font-size:13.5px}
#tourCard .bar{height:4px;background:#eceff4;border-radius:4px;margin-bottom:12px;overflow:hidden}
#tourCard .bar i{display:block;height:100%;background:var(--red)}
/* report */
#report{display:none}
.rp-page{background:#fff;width:8.5in;min-height:11in;margin:0 auto 24px;padding:.55in .6in .7in;box-shadow:0 4px 20px rgba(0,0,0,.12);position:relative;font-size:11.5px}
.rp-page h1{font-size:22px}
.rp-page h2{font-size:15px;margin:14px 0 8px;border-bottom:2px solid var(--red);padding-bottom:4px}
.rp-band{background:var(--navy);color:#fff;margin:-.55in -.6in 18px;padding:18px .6in 16px;position:relative}
.rp-band .logo{display:inline-flex;padding:4px 8px}
.rp-band .logo img{height:18px}
.rp-band h1{color:#fff;margin:10px 0 2px}
.rp-band .s{opacity:.85;font-size:12px}
.rp-band:after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:var(--red)}
.rp-foot{position:absolute;left:.6in;right:.6in;bottom:.3in;font-size:8.5px;color:#7a8394;display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:5px}
.rp-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:10px 0}
.rp-kpis .kpi{padding:10px 12px}
.rp-kpis .kpi .v{font-size:22px}
.rp-page table.t{font-size:10.5px}
.rp-page table.t th{font-size:10px;padding:5px 6px}
.rp-page table.t td{padding:4px 6px}
.rp-page .reco{padding:6px 10px;margin-bottom:7px}.rp-page .reco h4{font-size:12px}.rp-page .reco p{font-size:10.5px}
.rp-page .heat td{padding:2px 5px}.rp-page .heat td.h{font-size:10px}
.rp-msg{background:var(--soft);border-radius:10px;padding:12px 14px;font-size:12.5px}
.rp-small{font-size:10px;color:var(--muted)}
@media print{
  @page{size:letter portrait;margin:0}
  body{background:#fff}
  .top,.side,main,.toast,.wrap,#tourShade{display:none!important}
  #report{display:block!important}
  .rp-page{box-shadow:none;margin:0;page-break-after:always;break-after:page;width:8.5in;height:10.96in;min-height:auto;overflow:hidden}
  .rp-page:last-child{page-break-after:auto}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media (max-width:900px){.wrap{grid-template-columns:1fr}.side{position:static;height:auto}.levels{grid-template-columns:1fr 1fr}.grid2,.grid3,.grid4{grid-template-columns:1fr}.hero .icons{display:none}}
</style>
</head>

y material de proyectos específicos que no debe mezclarse.", "Gestión visual": "Tableros por orden/proyecto (avance vs. plan por hito) además de hora×hora; identificación visual de kits y material por número de orden.", "Andon y escalamiento": "Además de fallas de equipo, escalar faltantes de material, dudas o errores de ingeniería y planos: son las causas típicas de paro en ETO.", "Takt y trabajo estandarizado": "Calcular un takt por horas de contenido de trabajo (carga en horas estándar ÷ tiempo disponible) o un ritmo por estación; estandarizar por elementos modulares repetibles, aunque el producto final cambie.", "Layout y flujo continuo": "Flujo por familias o módulos (p. ej., secciones, gabinetes) con estaciones de ritmo fijo; el flujo 'una pieza' se interpreta como una orden o un módulo a la vez.", "Pull, kanban y pacemaker": "Kanban solo para componentes comunes/estándar de alta rotación; el material específico de cada orden se maneja con kits y secuencia. El pacemaker suele ser el ensamble final o la prueba.", "SMED (cambio rápido)": "Muy relevante en Fabricación (alta mezcla, lotes pequeños). En ensamble ETO aplica a preparación de estación y cambio de configuración.", "Gestión de restricciones": "La restricción puede estar en ingeniería, compras o prueba, no solo en el piso; identificarla en el VSM order-to-cash.", "TPM (Mantenimiento productivo total) y OEE": "Aplica a equipos críticos de Fabricación y prueba. El OEE se calcula sobre el tiempo planeado; en alta mezcla separar las pérdidas por cambio de modelo.", "Poka-yoke y calidad en la fuente": "Enfocar a errores de interpretación de planos, conexionado y configuración; listas de verificación por tipo de orden y autoinspección.", "Solución de problemas": "Incluir problemas de origen en ingeniería o en la cotización; los 8D deben llegar a la causa en el diseño cuando aplique.", "Gestión diaria": "Reunión de arranque con avance por orden, faltantes y riesgos de entrega; scorecard SQDC (Seguridad, Calidad, Entrega, Costo).", "Kaizen": "Priorizar eventos sobre el flujo de información (liberación de órdenes, cambios de ingeniería) y sobre la estación pacemaker."}, "eto_en": {"VSM (Mapeo de flujo de valor)": "Map by product family or typical configuration, from order to shipment (order-to-cash), including engineering, drawing release and purchasing: in ETO most of the lead time happens before the shop floor.", "5S": "Applies unchanged. In ETO it is critical for tooling, order-specific kits and project material that must not be mixed.", "Gestión visual": "Boards by order/project (progress vs. milestone plan) in addition to hour-by-hour boards; visual identification of kits and material by order number.", "Andon y escalamiento": "Besides equipment failures, escalate material shortages, engineering or drawing questions and errors: these are the typical stop causes in ETO.", "Takt y trabajo estandarizado": "Calculate takt from work-content hours (standard-hour load ÷ available time) or a pitch per station; standardize repeatable modular elements even when the final product changes.", "Layout y flujo continuo": "Flow by families or modules (e.g., sections, enclosures) with fixed-pace stations; 'one-piece flow' means one order or one module at a time.", "Pull, kanban y pacemaker": "Kanban only for common/standard high-runner components; order-specific material is handled with kits and sequence. The pacemaker is usually final assembly or testing.", "SMED (cambio rápido)": "Highly relevant in Fabrication (high mix, small lots). In ETO assembly it applies to station set-up and configuration changes.", "Gestión de restricciones": "The constraint may sit in engineering, purchasing or testing, not only on the floor; identify it in the order-to-cash VSM.", "TPM (Mantenimiento productivo total) y OEE": "Applies to critical Fabrication and test equipment. OEE is calculated over planned time; in high mix, separate model-change losses.", "Poka-yoke y calidad en la fuente": "Focus on drawing-interpretation, wiring and configuration errors; checklists by order type and self-inspection.", "Solución de problemas": "Include problems originating in engineering or quoting; 8Ds should reach the design cause when applicable.", "Gestión diaria": "Start-up meeting with progress by order, shortages and delivery risks; SQDC scorecard (Safety, Quality, Delivery, Cost).", "Kaizen": "Prioritize events on the information flow (order release, engineering changes) and on the pacemaker station."}, "cats": [{"short": "Flujo", "name": "1. Flujo de manufactura", "practices": [{"code": "FL-01", "tool": "Andon y escalamiento", "name": "Proceso de escalamiento", "name_en": "Escalation process", "crit": {"1": "Existe una matriz de escalamiento para todos los procesos programados (líneas, celdas, alimentadores) con roles, responsables y tiempo permitido para atender un problema; indica cuándo y a quién escalar y está publicada en piso.", "2": "Existe una estructura/proceso para reprogramar y ejecutar con el fin de recuperar el flujo dentro del takt.", "3": "El flujo se recupera dentro del takt. Soporte funcional y técnicos identifican y eliminan la causa raíz de forma continua."}, "crit_en": {"1": "An escalation matrix exists for all scheduled processes (lines, cells, feeders) with roles, owners and time allowed to address a problem; it states when and to whom to escalate and is posted on the floor.", "2": "A structure/process exists to re-plan and execute in order to restore flow within takt.", "3": "Flow is restored within takt. Functional support and technicians identify and remove root causes on an ongoing basis."}}, {"code": "FL-02", "tool": "Pull, kanban y pacemaker", "name": "Programación al pacemaker", "name_en": "Pacemaker scheduling", "crit": {"1": "Se identifica el/los proceso(s) pacemaker como punto único de programación (el pacemaker no es necesariamente la restricción).", "2": "La producción se programa al pacemaker.", "3": "El programa maestro de producción está nivelado (heijunka) al pacemaker."}, "crit_en": {"1": "The pacemaker process(es) are identified as the single scheduling point (the pacemaker is not necessarily the constraint).", "2": "Production is scheduled to the pacemaker.", "3": "The master production schedule is level-loaded (heijunka) to the pacemaker."}}, {"code": "FL-03", "tool": "Pull, kanban y pacemaker", "name": "Kanban interno", "name_en": "Internal kanban", "crit": {"1": "Existen supermercados en proceso para apoyar el flujo (pacemaker y alimentadores); uso limitado de kanban (p. ej., doble contenedor). ETO: solo componentes comunes.", "2": "Existe un sistema de administración de kanban. Se completa el PFEP (Plan for Every Part) conforme las partes pasan a kanban.", "3": "Kanban y PFEP se revisan periódicamente (niveles de inventario, cantidad por contenedor y nivel de servicio)."}, "crit_en": {"1": "In-process supermarkets support flow (pacemaker and feeders); limited kanban use (e.g., two-bin). ETO: common components only.", "2": "A kanban management system exists. The PFEP (Plan for Every Part) is completed as parts move to kanban.", "3": "Kanban and PFEP are reviewed periodically (inventory levels, container quantity and service level)."}}, {"code": "FL-04", "tool": "Pull, kanban y pacemaker", "name": "Implementación de pull", "name_en": "Pull implementation", "crit": {"1": "Los procesos están clasificados como push o pull y existe un plan para convertir celdas push a pull.", "2": "El área piloto implementa pull hacia las operaciones posteriores (cliente interno).", "3": "Algunas líneas alimentadoras implementan pull hacia el pacemaker."}, "crit_en": {"1": "Processes are classified as push or pull and there is a plan to convert push cells to pull.", "2": "The pilot area implements pull to downstream operations (internal customer).", "3": "Some feeder lines implement pull to the pacemaker."}}, {"code": "FL-05", "tool": "Gestión de restricciones", "name": "Gestión de restricciones", "name_en": "Constraint management", "crit": {"1": "Las restricciones están identificadas en todos los flujos de valor (VSM, análisis de inventario, pérdidas de producción, etc.). ETO: incluir ingeniería, compras y prueba.", "2": "Se realizan kaizens para reducir el impacto de la restricción o romperla.", "3": "Se identifican nuevas restricciones de forma continua conforme se eliminan o mejoran las anteriores."}, "crit_en": {"1": "Constraints are identified in all value streams (VSM, inventory analysis, production losses, etc.). ETO: include engineering, purchasing and testing.", "2": "Kaizens are run to reduce the constraint's impact or break it.", "3": "New constraints are identified continuously as previous ones are removed or improved."}}, {"code": "FL-06", "tool": "Layout y flujo continuo", "name": "Layout de planta", "name_en": "Plant layout", "crit": {"1": "El equipo está agrupado por proceso o tecnología (departamental), pero se gestiona por producto.", "2": "El layout optimiza el flujo de material, enlazando procesos, máquinas y habilidades distintas para producir familias de producto dentro del flujo de valor.", "4": "El layout total de la planta se revisa metódicamente por agrupación de producto y flujo de valor; la planta está optimizada para el flujo interno y externo."}, "crit_en": {"1": "Equipment is grouped by process or technology (departmental) but managed by product.", "2": "The layout optimizes material flow, linking different processes, machines and skills to produce product families within the value stream.", "4": "The whole plant layout is reviewed methodically by product grouping and value stream; the plant is optimized for internal and external flow."}}, {"code": "FL-07", "tool": "Layout y flujo continuo", "name": "Manejo de materiales", "name_en": "Material handling", "crit": {"1": "Existen métricas de efectividad del manejo de materiales: presentación en punto de uso (POU), número de toques, cambios de orientación, distancia, etc.", "2": "Existe trabajo estandarizado para manejo de materiales y planes de acción para mejorarlo en todos los flujos de valor núcleo.", "4": "El material se entrega directo al punto de uso, de proceso a proceso. Manejo de materiales integrado con el sistema de información."}, "crit_en": {"1": "Material-handling effectiveness metrics exist: point-of-use (POU) presentation, number of touches, orientation changes, distance, etc.", "2": "Standardized work exists for material handling and there are action plans to improve it in all core value streams.", "4": "Material is delivered directly to the point of use, process to process. Material handling is integrated with the information system."}}, {"code": "FL-08", "tool": "Layout y flujo continuo", "name": "Flujo de material", "name_en": "Material flow", "crit": {"2": "No se ensambla ni se termina producto sin una orden o señal.", "3": "El producto terminado permanece en el área de embarque no más de un turno (< 8 h).", "4": "Flujo de alta velocidad con mínimos toques; todas las áreas fluyen una pieza/una orden a la vez hasta el embarque."}, "crit_en": {"2": "No product is assembled or finished without an order or signal.", "3": "Finished product stays in the shipping area no longer than one shift (< 8 h).", "4": "High-velocity flow with minimal touches; all areas flow one piece/one order at a time to shipping."}}, {"code": "FL-09", "tool": "Layout y flujo continuo", "name": "Estructura de líneas", "name_en": "Line structure", "crit": {"1": "Al menos 50 % de las operaciones (producto núcleo) organizadas en modelo mixto (si aplica), celdas o líneas de flujo.", "2": "75 % de las operaciones en modelo mixto, celdas o líneas de flujo; 25 % de las líneas alimentadoras surten directo al pacemaker en el punto de uso.", "3": "100 % de las operaciones en modelo mixto, celdas o líneas de flujo; 50 % de las alimentadoras surten directo al pacemaker en el punto de uso.", "4": "100 % de las alimentadoras surten directo al pacemaker en el punto de uso; todas las operaciones en flujo enlazado de alta velocidad."}, "crit_en": {"1": "At least 50% of operations (core product) organized in mixed model (if applicable), cells or flow lines.", "2": "75% of operations in mixed model, cells or flow lines; 25% of feeder lines supply the pacemaker directly at the point of use.", "3": "100% of operations in mixed model, cells or flow lines; 50% of feeders supply the pacemaker directly at the point of use.", "4": "100% of feeders supply the pacemaker directly at the point of use; all operations in high-velocity linked flow."}}, {"code": "FL-10", "tool": "Layout y flujo continuo", "name": "Estructura de alimentadores", "name_en": "Feeder structure", "crit": {"2": "50 % de los procesos alimentadores están enlazados para reducir WIP (inventario en proceso).", "3": "75 % de los procesos alimentadores están enlazados para reducir WIP.", "4": "100 % de las operaciones están enlazadas con niveles de WIP claros entre operaciones."}, "crit_en": {"2": "50% of feeder processes are linked to reduce WIP (work in process).", "3": "75% of feeder processes are linked to reduce WIP.", "4": "100% of operations are linked with clear WIP levels between operations."}}, {"code": "FL-11", "tool": "Takt y trabajo estandarizado", "name": "Takt time", "name_en": "Takt time", "crit": {"1": "El takt está calculado con la demanda diaria máxima esperada de los próximos 12 meses. ETO: takt en horas de contenido de trabajo o ritmo por estación.", "2": "El takt se calcula con la demanda máxima de 12 meses y se revisa mensualmente.", "3": "El takt se recalcula semanalmente, la línea se rebalancea y el takt se exhibe; se calcula de forma que permita la mejora continua."}, "crit_en": {"1": "Takt is calculated with the maximum expected daily demand for the next 12 months. ETO: takt in work-content hours or pitch per station.", "2": "Takt is calculated with the 12-month maximum demand and reviewed monthly.", "3": "Takt is recalculated weekly, the line is rebalanced and takt is displayed; it is calculated to allow continuous improvement."}}, {"code": "FL-12", "tool": "Takt y trabajo estandarizado", "name": "Flexibilidad de personal", "name_en": "Staffing flexibility", "crit": {"1": "El número de operadores requerido en todas las operaciones se calcula con base en la demanda.", "2": "Existe un programa de entrenamiento cruzado (matriz de polivalencia) implementado como base para mover personal.", "4": "Existen señales que indican al personal cuándo y a dónde moverse entre su función primaria y secundaria."}, "crit_en": {"1": "The number of operators required in all operations is calculated from demand.", "2": "A cross-training program (skills matrix) is implemented as the basis to move people.", "4": "Signals tell people when and where to move between their primary and secondary function."}}, {"code": "FL-13", "tool": "Takt y trabajo estandarizado", "name": "Elementos de trabajo estandarizado", "name_en": "Standardized work elements", "crit": {"1": "100 % de las operaciones tienen trabajo estandarizado/instrucciones de trabajo, con un plan para mantenerlas.", "2": "En los procesos núcleo, el trabajo estandarizado divide la operación en elementos con base en el takt e identifica actividades que agregan y no agregan valor.", "3": "Existe un sistema de auditoría para gestionar y mejorar el trabajo estandarizado; los estudios de tiempo se actualizan al menos cada seis meses.", "4": "Las líneas núcleo tienen trabajo estandarizado electrónico e interactivo, con un método sencillo de actualización."}, "crit_en": {"1": "100% of operations have standardized work/work instructions, with a plan to maintain them.", "2": "In core processes, standardized work breaks the operation into elements based on takt and identifies value-added and non-value-added activities.", "3": "An audit system exists to manage and improve standardized work; time studies are updated at least every six months.", "4": "Core lines have electronic, interactive standardized work with a simple update method."}}, {"code": "FL-14", "tool": "Takt y trabajo estandarizado", "name": "Participación de asociados", "name_en": "Associate involvement", "crit": {"1": "El líder de grupo es responsable de dar seguimiento al ritmo de producción, problemas y logros.", "2": "El líder de grupo identifica elementos de trabajo con y sin valor agregado y elimina los que no agregan valor.", "3": "Todos los asociados participan en identificar y eliminar elementos sin valor agregado, con eventos guiados por ingeniería de manufactura o supervisión."}, "crit_en": {"1": "The group leader tracks production rate, problems and achievements.", "2": "The group leader identifies value-added and non-value-added work elements and removes the latter.", "3": "All associates take part in identifying and removing non-value-added elements, with events guided by manufacturing engineering or supervision."}}, {"code": "FL-15", "tool": "SMED (cambio rápido)", "name": "Herramental para cambio rápido", "name_en": "Quick-changeover tooling", "crit": {"1": "Herramental, equipo y material de todas las máquinas de fabricación y ensamble se preparan con anticipación y se ubican cerca del punto de uso, según instrucciones de trabajo.", "2": "Se aplican técnicas de cambio rápido de bajo costo: sujeciones rápidas, 5S y ajustes simples.", "3": "Se implementan mejoras de mayor inversión: herramientas especiales, rediseño de fixtures, reubicación de controles, etc.", "4": "Uso mínimo de herramientas en todas las máquinas de fabricación; ninguna herramienta para cambios en ensamble."}, "crit_en": {"1": "Tooling, equipment and material for all fabrication and assembly machines are prepared in advance and placed near the point of use, per work instructions.", "2": "Low-cost quick-changeover techniques are applied: quick clamps, 5S and simple adjustments.", "3": "Higher-investment improvements are implemented: special tools, fixture redesign, control relocation, etc.", "4": "Minimal tool use on all fabrication machines; no tools for assembly changeovers."}}, {"code": "FL-16", "tool": "SMED (cambio rápido)", "name": "Análisis de cambio rápido", "name_en": "Quick-changeover analysis", "crit": {"1": "25 % de las máquinas con cambios analizadas con SMED: trabajo interno convertido a externo y pasos eliminados; foco en equipos restricción.", "2": "50 % de las máquinas con cambios analizadas con SMED.", "3": "75 % de las máquinas con cambios analizadas con SMED.", "4": "100 % de las máquinas con cambios analizadas con SMED."}, "crit_en": {"1": "25% of machines with changeovers analyzed with SMED: internal work converted to external and steps removed; focus on constraint equipment.", "2": "50% of machines with changeovers analyzed with SMED.", "3": "75% of machines with changeovers analyzed with SMED.", "4": "100% of machines with changeovers analyzed with SMED."}}, {"code": "FL-17", "tool": "SMED (cambio rápido)", "name": "Seguimiento de cambios", "name_en": "Changeover tracking", "crit": {"1": "25 % de los equipos restricción tienen seguimiento continuo del tiempo de cambio y acciones para reducirlo.", "2": "50 % de los equipos restricción con seguimiento y acciones.", "3": "75 % de los equipos restricción con seguimiento y acciones.", "4": "100 % de los equipos restricción con seguimiento y acciones."}, "crit_en": {"1": "25% of constraint equipment has ongoing changeover-time tracking and reduction actions.", "2": "50% of constraint equipment with tracking and actions.", "3": "75% of constraint equipment with tracking and actions.", "4": "100% of constraint equipment with tracking and actions."}}], "metrics": [{"code": "FL-E1", "tool": "Layout y flujo continuo", "q": "¿Qué porcentaje del costo de producción (COGS) fluye directo a la línea principal, identificable visualmente?", "q_en": "What percentage of production cost (COGS) flows directly to the main line, visually identifiable?", "opts": [["< 25 %", 0], ["≥ 25 % y < 50 %", 1], ["≥ 50 % y < 65 %", 2], ["≥ 65 % y < 80 %", 3], ["≥ 80 %", 4]], "opts_en": ["< 25%", "≥ 25% and < 50%", "≥ 50% and < 65%", "≥ 65% and < 80%", "≥ 80%"]}, {"code": "FL-E2", "tool": "Layout y flujo continuo", "q": "¿Qué % de los procesos del flujo de valor núcleo (fabricación y ensamble) opera en celdas o flujo?", "q_en": "What % of core value-stream processes (fabrication and assembly) run in cells or flow?", "opts": [["< 25 %", 0], ["≥ 25 % y < 50 %", 1], ["≥ 50 % y < 75 %", 2], ["≥ 75 % y < 100 %", 3], ["100 %", 4]], "opts_en": ["< 25%", "≥ 25% and < 50%", "≥ 50% and < 75%", "≥ 75% and < 100%", "100%"]}, {"code": "FL-E3", "tool": "Takt y trabajo estandarizado", "q": "Diferencia de contenido de trabajo entre la estación más cargada y la menos cargada de una línea (diferencia ÷ tiempo mayor, muestreo real)", "q_en": "Work-content difference between the most and least loaded station on a line (difference ÷ highest time, actual sampling)", "opts": [["> 20 %", 0], ["> 15 % y ≤ 20 %", 1], ["> 10 % y ≤ 15 %", 2], ["> 5 % y ≤ 10 %", 3], ["≤ 5 %", 4]], "opts_en": ["> 20%", "> 15% and ≤ 20%", "> 10% and ≤ 15%", "> 5% and ≤ 10%", "≤ 5%"]}, {"code": "FL-E4", "tool": "Takt y trabajo estandarizado", "q": "% de producto/órdenes terminadas dentro del takt o ritmo planeado (muestra ≥ 10 en la última estación)", "q_en": "% of products/orders finished within the planned takt or pitch (sample ≥ 10 at the last station)", "opts": [["< 70 %", 0], ["≥ 70 % y < 80 %", 1], ["≥ 80 % y < 90 %", 2], ["≥ 90 % y < 100 %", 3], ["100 %", 4]], "opts_en": ["< 70%", "≥ 70% and < 80%", "≥ 80% and < 90%", "≥ 90% and < 100%", "100%"]}, {"code": "FL-E5", "tool": "SMED (cambio rápido)", "q": "Tiempo promedio de cambio en líneas de ensamble que requieren cambio", "q_en": "Average changeover time on assembly lines that require changeovers", "opts": [["Mayor al takt", 0], ["Igual al takt", 1], ["75 % del takt", 2], ["50 % del takt", 3], ["25 % del takt", 4]], "opts_en": ["Above takt", "Equal to takt", "75% of takt", "50% of takt", "25% of takt"]}, {"code": "FL-E6", "tool": "SMED (cambio rápido)", "q": "% de máquinas de fabricación con cambios que cumplen la meta SMED", "q_en": "% of fabrication machines with changeovers that meet the SMED goal", "opts": [["< 50 %", 0], ["≥ 50 % y < 65 %", 1], ["≥ 65 % y < 80 %", 2], ["≥ 80 % y < 95 %", 3], ["≥ 95 %", 4]], "opts_en": ["< 50%", "≥ 50% and < 65%", "≥ 65% and < 80%", "≥ 80% and < 95%", "≥ 95%"]}, {"code": "FL-E7", "tool": "Pull, kanban y pacemaker", "q": "¿Con qué frecuencia se revisan los kanban de partes fabricadas y su dimensionamiento?", "q_en": "How often are kanbans for manufactured parts and their sizing reviewed?", "opts": [["Más de un año sin revisión", 0], ["Anual", 1], ["Cada 9 meses", 2], ["Semestral", 3], ["Trimestral", 4]], "opts_en": ["More than a year without review", "Yearly", "Every 9 months", "Every 6 months", "Quarterly"]}, {"code": "FL-E8", "tool": "Pull, kanban y pacemaker", "q": "% de partes fabricadas (comunes/estándar) con señal kanban física o electrónica", "q_en": "% of manufactured (common/standard) parts on a physical or electronic kanban signal", "opts": [["< 20 %", 0], ["≥ 20 % y < 40 %", 1], ["≥ 40 % y < 60 %", 2], ["≥ 60 % y < 80 %", 3], ["≥ 80 %", 4]], "opts_en": ["< 20%", "≥ 20% and < 40%", "≥ 40% and < 60%", "≥ 60% and < 80%", "≥ 80%"]}, {"code": "FL-E9", "tool": "Pull, kanban y pacemaker", "q": "% de celdas operativas que trabajan en pull (vs. push)", "q_en": "% of operating cells working in pull (vs. push)", "opts": [["< 25 %", 0], ["≥ 25 % y < 50 %", 1], ["≥ 50 % y < 75 %", 2], ["≥ 75 % y < 90 %", 3], ["≥ 90 %", 4]], "opts_en": ["< 25%", "≥ 25% and < 50%", "≥ 50% and < 75%", "≥ 75% and < 90%", "≥ 90%"]}]}, {"short": "Visual y 5S", "name": "2. Gestión visual y 5S", "practices": [{"code": "VI-01", "tool": "Andon y escalamiento", "name": "Sistema de señales (andon)", "name_en": "Signal system (andon)", "crit": {"1": "Se usa un sistema de señales (p. ej., luces andon) en un área piloto para avisar problemas del proceso, con un procedimiento documentado de respuesta.", "2": "En todas las líneas núcleo, cada estación tiene acceso directo a un sistema de señales que se monitorea y mantiene.", "3": "El sistema de señales distingue urgencia y tipo de ayuda requerida (calidad, material, ingeniería, mantenimiento)."}, "crit_en": {"1": "A signal system (e.g., andon lights) is used in a pilot area to flag process problems, with a documented response procedure.", "2": "On all core lines, every station has direct access to a signal system that is monitored and maintained.", "3": "The signal system distinguishes urgency and type of help needed (quality, material, engineering, maintenance)."}}, {"code": "VI-02", "tool": "Andon y escalamiento", "name": "Gestión del sistema de señales", "name_en": "Signal-system management", "crit": {"2": "La supervisión hace un Pareto mensual de las llamadas del andon y asigna acciones correctivas a las causas principales."}, "crit_en": {"2": "Supervision runs a monthly Pareto of andon calls and assigns corrective actions to the main causes."}}, {"code": "VI-03", "tool": "Gestión visual", "name": "Tableros de producción", "name_en": "Production boards", "crit": {"1": "Se usan tableros de producción en un área piloto (programado vs. real en tiempo o unidades), actualizados en tiempo real. ETO: avance por orden vs. hitos.", "2": "Se usan en todas las líneas núcleo, en tiempo real; la supervisión retroalimenta durante el turno y decide acciones para cumplir el programa.", "3": "Los asociados retroalimentan durante el turno el estado del programa y deciden acciones."}, "crit_en": {"1": "Production boards are used in a pilot area (planned vs. actual in time or units), updated in real time. ETO: progress by order vs. milestones.", "2": "Used on all core lines in real time; supervision gives feedback during the shift and decides actions to meet the schedule.", "3": "Associates give feedback during the shift on schedule status and decide actions."}}, {"code": "VI-04", "tool": "Gestión visual", "name": "Controles visuales", "name_en": "Visual controls", "crit": {"1": "Señalización que distingue áreas de trabajo, inventario y depósito de material; contenedores, anaqueles y organizadores etiquetados.", "2": "Señalización y marcaje de piso estándar para trabajo, inventario, depósito, basura, no conforme, contenedores vacíos, tableros de sombra y equipo, según el estándar ABB de la planta.", "3": "La apariencia del área se monitorea con auditorías 5S diarias; iluminación adecuada, pisos marcados y mantenimiento regular; tamaños de contenedor reducidos a lotes eficientes."}, "crit_en": {"1": "Signage distinguishes work, inventory and material drop areas; containers, shelves and organizers are labeled.", "2": "Standard signage and floor marking for work, inventory, drop, trash, non-conforming, empty containers, shadow boards and equipment, per the plant/ABB standard.", "3": "Area appearance is monitored with daily 5S audits; adequate lighting, marked floors and regular maintenance; container sizes reduced to efficient lots."}}, {"code": "VI-05", "tool": "5S", "name": "5S en piso", "name_en": "5S on the shop floor", "crit": {"1": "La supervisión realiza auditorías 5S estándar en la mayoría de las áreas, aunque no se revisan continuamente y los hallazgos no se registran ni son visibles.", "2": "Los asociados realizan auditorías 5S en todas las áreas.", "3": "Todas las tareas 5S están estandarizadas y publicadas (limpieza, responsables, frecuencia de auditoría, etc.)."}, "crit_en": {"1": "Supervision performs standard 5S audits in most areas, although they are not reviewed continuously and findings are neither recorded nor visible.", "2": "Associates perform 5S audits in all areas.", "3": "All 5S tasks are standardized and posted (cleaning, owners, audit frequency, etc.)."}}, {"code": "VI-06", "tool": "5S", "name": "5S en oficinas de soporte", "name_en": "5S in support offices", "crit": {"1": "La gerencia realiza auditorías 5S en la mayoría de las oficinas, aunque no se revisan continuamente y los hallazgos no se registran ni son visibles.", "2": "Los colaboradores realizan auditorías 5S en todas las oficinas (ingeniería, planeación, compras).", "3": "Todas las tareas 5S de oficina están estandarizadas y publicadas."}, "crit_en": {"1": "Management performs 5S audits in most offices, although they are not reviewed continuously and findings are neither recorded nor visible.", "2": "Employees perform 5S audits in all offices (engineering, planning, purchasing).", "3": "All office 5S tasks are standardized and posted."}}, {"code": "VI-07", "tool": "5S", "name": "Iluminación y código de colores", "name_en": "Lighting and color coding", "crit": {"1": "Todas las áreas cumplen la norma de iluminación aplicable según la función del puesto (p. ej., NOM-025-STPS).", "2": "El área piloto usa código de colores estándar para tuberías de aire, agua, gas y otros servicios.", "3": "Todas las áreas usan código de colores estándar para tuberías de servicios."}, "crit_en": {"1": "All areas meet the applicable lighting standard for the job function (e.g., NOM-025-STPS).", "2": "The pilot area uses standard color coding for air, water, gas and other utility lines.", "3": "All areas use standard color coding for utility lines."}}, {"code": "VI-08", "tool": "5S", "name": "Entrenamiento en 5S", "name_en": "5S training", "crit": {"1": "Todo el personal está entrenado en los principios de 5S.", "2": "Todo el personal participa en actividades 5S.", "3": "Los propios asociados imparten el entrenamiento 5S."}, "crit_en": {"1": "All personnel are trained in 5S principles.", "2": "All personnel take part in 5S activities.", "3": "Associates themselves deliver the 5S training."}}, {"code": "VI-09", "tool": "5S", "name": "Tarjeta roja", "name_en": "Red tag", "crit": {"1": "Se usa el proceso de tarjeta roja en el área piloto.", "2": "El proceso de tarjeta roja se usa en todas las áreas con disposición rápida o en tiempo real.", "3": "Los asociados administran el proceso de tarjeta roja."}, "crit_en": {"1": "The red-tag process is used in the pilot area.", "2": "The red-tag process is used in all areas with quick or real-time disposition.", "3": "Associates manage the red-tag process."}}], "metrics": [{"code": "VI-E1", "tool": "Andon y escalamiento", "q": "Tiempo de respuesta para atender una señal del andon (verificar con una prueba)", "q_en": "Response time to answer an andon signal (verify with a test)", "opts": [["> 5 min", 0], ["> 3 y ≤ 5 min", 1], ["> 1 y ≤ 3 min", 2], ["≤ 1 min", 3]], "opts_en": ["> 5 min", "> 3 and ≤ 5 min", "> 1 and ≤ 3 min", "≤ 1 min"]}, {"code": "VI-E2", "tool": "Gestión visual", "q": "¿Los datos de los tableros están actualizados? (muestreo)", "q_en": "Is board data up to date? (sampling)", "opts": [["Más de 2 datos desactualizados", 0], ["2 datos desactualizados", 1], ["1 dato desactualizado", 2], ["100 % actualizado", 3]], "opts_en": ["More than 2 data points outdated", "2 data points outdated", "1 data point outdated", "100% up to date"]}, {"code": "VI-E3", "tool": "5S", "q": "Calificación 5S promedio de la planta (piso y oficinas, escala 0–5)", "q_en": "Plant average 5S score (floor and offices, 0–5 scale)", "opts": [["< 2", 0], ["≥ 2 y < 3", 1], ["≥ 3 y < 4", 2], ["≥ 4", 3]], "opts_en": ["< 2", "≥ 2 and < 3", "≥ 3 and < 4", "≥ 4"]}, {"code": "VI-E4", "tool": "5S", "q": "Tiempo para atender los hallazgos de auditoría 5S (con plan de acción y revisión)", "q_en": "Time to address 5S audit findings (with action plan and review)", "opts": [["> 1 semana", 0], ["> 3 días y ≤ 1 semana", 1], ["> 1 y ≤ 3 días", 2], ["≤ 1 día", 3]], "opts_en": ["> 1 week", "> 3 days and ≤ 1 week", "> 1 and ≤ 3 days", "≤ 1 day"]}]}, {"short": "VSM", "name": "3. Mapeo de flujo de valor (VSM)", "practices": [{"code": "VS-01", "tool": "VSM (Mapeo de flujo de valor)", "name": "Aplicación", "name_en": "Application", "crit": {"1": "Un producto/familia piloto tiene mapa de estado actual y futuro con métricas clave y factores críticos de éxito a mejorar.", "2": "Todas las familias núcleo incluidas en la hoja de ruta del año actual y siguiente tienen mapa actual y futuro.", "3": "Hay evidencia de que los mapas se actualizan conforme se implementan cambios, o al menos cada seis meses."}, "crit_en": {"1": "A pilot product/family has current- and future-state maps with key metrics and critical success factors to improve.", "2": "All core families in this year's and next year's roadmap have current- and future-state maps.", "3": "There is evidence that maps are updated as changes are implemented, or at least every six months."}}, {"code": "VS-02", "tool": "VSM (Mapeo de flujo de valor)", "name": "Alcance", "name_en": "Scope", "crit": {"1": "El VSM de manufactura abarca de puerta a puerta (de la puerta del proveedor a la del cliente).", "2": "El VSM abarca de la base de suministro a la entrega (proveedores y clientes estratégicos).", "3": "El VSM abarca de la orden al cobro (order-to-cash), incluidos los procesos transaccionales. ETO: ingeniería, liberación de planos y compras."}, "crit_en": {"1": "The manufacturing VSM covers door to door (supplier's door to customer's door).", "2": "The VSM covers from the supply base to delivery (strategic suppliers and customers).", "3": "The VSM covers order to cash, including transactional processes. ETO: engineering, drawing release and purchasing."}}, {"code": "VS-03", "tool": "VSM (Mapeo de flujo de valor)", "name": "Metas y recursos", "name_en": "Goals and resources", "crit": {"1": "Se asignan recursos a los proyectos identificados en el VSM piloto; los proyectos están en la hoja de ruta de transformación.", "2": "Se asignan recursos a los proyectos de todos los VSM; los proyectos están en la hoja de ruta.", "3": "Hay evidencia de transformaciones exitosas e iterativas (el estado futuro anterior es el actual y se definió uno nuevo)."}, "crit_en": {"1": "Resources are assigned to the projects identified in the pilot VSM; projects are in the transformation roadmap.", "2": "Resources are assigned to the projects of all VSMs; projects are in the roadmap.", "3": "There is evidence of successful, iterative transformations (the former future state is now the current state and a new one has been defined)."}}, {"code": "VS-04", "tool": "VSM (Mapeo de flujo de valor)", "name": "Liderazgo", "name_en": "Leadership", "crit": {"1": "Ingenieros, supervisores y personal de piso participan activamente en proyectos de creación de valor.", "2": "Al menos una persona es responsable de mantener los VSM, identificar proyectos y ejecutar el plan (p. ej., líder de Excelencia Operacional).", "3": "Cada flujo de valor tiene un dueño designado, responsable de metas y de su gestión."}, "crit_en": {"1": "Engineers, supervisors and shop-floor staff take an active part in value-creating projects.", "2": "At least one person is responsible for maintaining the VSMs, identifying projects and executing the plan (e.g., Operational Excellence lead).", "3": "Each value stream has a designated owner accountable for its goals and management."}}, {"code": "VS-05", "tool": "VSM (Mapeo de flujo de valor)", "name": "Cliente y proveedor", "name_en": "Customer and supplier", "crit": {"1": "Los factores de valor definidos por el cliente están identificados e incorporados en el VSM.", "2": "Proveedores clave participan en talleres de VSM extendido.", "3": "Clientes clave participan en talleres de VSM extendido."}, "crit_en": {"1": "Customer-defined value drivers are identified and built into the VSM.", "2": "Key suppliers take part in extended VSM workshops.", "3": "Key customers take part in extended VSM workshops."}}, {"code": "VS-06", "tool": "VSM (Mapeo de flujo de valor)", "name": "Difusión", "name_en": "Sharing", "crit": {"1": "Los logros y lecciones del VSM se comparten en toda la planta.", "2": "Se comparten con la división de negocio de ABB.", "3": "Se comparten con el Grupo ABB."}, "crit_en": {"1": "VSM achievements and lessons are shared across the plant.", "2": "They are shared with the ABB business division.", "3": "They are shared with the ABB Group."}}, {"code": "VS-07", "tool": "VSM (Mapeo de flujo de valor)", "name": "Indicador VA/NVA", "name_en": "VA/NVA indicator", "crit": {"1": "La relación valor agregado / no valor agregado (VA/NVA) es un indicador clave y se mide en los VSM disponibles.", "2": "Se mantienen actualizados los Pareto de actividades sin valor agregado en piso.", "3": "La relación VA/NVA forma parte de los objetivos de desempeño de la supervisión."}, "crit_en": {"1": "The value-added / non-value-added (VA/NVA) ratio is a key indicator measured in available VSMs.", "2": "Pareto charts of non-value-added activities on the floor are kept up to date.", "3": "The VA/NVA ratio is part of supervision's performance objectives."}}, {"code": "VS-08", "tool": "VSM (Mapeo de flujo de valor)", "name": "Enfoque estratégico", "name_en": "Strategic focus", "crit": {"2": "La planta definió sus productos/procesos núcleo y no núcleo.", "3": "La estrategia núcleo/no núcleo se revisa al menos una vez al año y se desarrollan alternativas para lo no núcleo."}, "crit_en": {"2": "The plant has defined its core and non-core products/processes.", "3": "The core/non-core strategy is reviewed at least yearly and alternatives are developed for non-core items."}}, {"code": "VS-09", "tool": "VSM (Mapeo de flujo de valor)", "name": "Uso de recursos", "name_en": "Resource use", "crit": {"1": "Se da seguimiento a la utilización de la mano de obra.", "2": "La utilización de espacio y equipo se analiza al menos una vez al año y se identifican oportunidades.", "3": "La utilización de recursos (mano de obra, espacio, equipo) se analiza al menos trimestralmente y las oportunidades se integran al plan de transformación."}, "crit_en": {"1": "Labor utilization is tracked.", "2": "Space and equipment utilization is analyzed at least yearly and opportunities are identified.", "3": "Resource utilization (labor, space, equipment) is analyzed at least quarterly and opportunities are built into the transformation plan."}}], "metrics": [{"code": "VS-E1", "tool": "VSM (Mapeo de flujo de valor)", "q": "¿Cuántas familias/flujos de valor núcleo tienen mapa actual y futuro completos y vigentes?", "q_en": "How many core families/value streams have complete, current current- and future-state maps?", "opts": [["Ninguno", 0], ["Uno", 1], ["Más de uno", 2], ["Todos", 3]], "opts_en": ["None", "One", "More than one", "All"]}, {"code": "VS-E2", "tool": "VSM (Mapeo de flujo de valor)", "q": "% de reducción del tiempo de entrega administrativo (incluye ingeniería en ETO) vs. línea base", "q_en": "% reduction in administrative lead time (includes engineering in ETO) vs. baseline", "opts": [["< 5 %", 0], ["≥ 5 % y < 15 %", 1], ["≥ 15 % y < 25 %", 2], ["≥ 25 %", 3]], "opts_en": ["< 5%", "≥ 5% and < 15%", "≥ 15% and < 25%", "≥ 25%"]}, {"code": "VS-E3", "tool": "VSM (Mapeo de flujo de valor)", "q": "% de reducción del tiempo de entrega de manufactura vs. línea base", "q_en": "% reduction in manufacturing lead time vs. baseline", "opts": [["< 5 %", 0], ["≥ 5 % y < 15 %", 1], ["≥ 15 % y < 25 %", 2], ["≥ 25 %", 3]], "opts_en": ["< 5%", "≥ 5% and < 15%", "≥ 15% and < 25%", "≥ 25%"]}, {"code": "VS-E4", "tool": "5S", "q": "% de espacio de manufactura liberado en los últimos 12 meses (5S, consolidación, kaizen)", "q_en": "% of manufacturing space freed in the last 12 months (5S, consolidation, kaizen)", "opts": [["< 1 %", 0], ["≥ 1 % y < 5 %", 1], ["≥ 5 % y < 10 %", 2], ["≥ 10 %", 3]], "opts_en": ["< 1%", "≥ 1% and < 5%", "≥ 5% and < 10%", "≥ 10%"]}]}, {"short": "TPM", "name": "4. TPM (Mantenimiento productivo total) y OEE", "practices": [{"code": "TP-01", "tool": "TPM (Mantenimiento productivo total) y OEE", "name": "Aplicación", "name_en": "Application", "crit": {"1": "Existe un proceso piloto de mantenimiento preventivo integrado a las órdenes de trabajo, con lista de verificación por equipo (aceite, lubricación, filtros, componentes programados).", "2": "Existe un sistema de mantenimiento preventivo (p. ej., CMMS) para los equipos críticos.", "3": "El sistema de mantenimiento preventivo cubre todo el equipo."}, "crit_en": {"1": "A pilot preventive-maintenance process exists, integrated with work orders, with a checklist per equipment (oil, lubrication, filters, scheduled components).", "2": "A preventive-maintenance system (e.g., CMMS) exists for critical equipment.", "3": "The preventive-maintenance system covers all equipment."}}, {"code": "TP-02", "tool": "TPM (Mantenimiento productivo total) y OEE", "name": "Alcance", "name_en": "Scope", "crit": {"1": "Existe una lista de equipos y refacciones críticas para el área piloto (considerar los PFMEA si existen).", "2": "Existe la lista de equipos y refacciones de toda la planta.", "3": "Existen AMEF de máquina para todo el equipo crítico (qué falla, por qué y su efecto en producción)."}, "crit_en": {"1": "A list of critical equipment and spare parts exists for the pilot area (consider PFMEAs if available).", "2": "The list of equipment and spare parts covers the whole plant.", "3": "Machine FMEAs exist for all critical equipment (what fails, why, and its effect on production)."}}, {"code": "TP-03", "tool": "TPM (Mantenimiento productivo total) y OEE", "name": "Participación del liderazgo", "name_en": "Leadership involvement", "crit": {"1": "Los responsables del equipo piloto (gerentes, ingenieros, supervisores) están entrenados en fundamentos de TPM; el avance y el Pareto de paros se revisan al menos cada dos semanas.", "2": "Los responsables de todo el equipo crítico están entrenados en TPM con el estándar de la planta; revisión al menos cada dos semanas.", "3": "El liderazgo actúa como mentor; el programa TPM lo dirigen los asociados o líderes de área."}, "crit_en": {"1": "Those responsible for the pilot equipment (managers, engineers, supervisors) are trained in TPM fundamentals; progress and the downtime Pareto are reviewed at least every two weeks.", "2": "Those responsible for all critical equipment are trained in TPM to the plant standard; reviewed at least every two weeks.", "3": "Leadership acts as mentor; the TPM program is driven by associates or area leaders."}}, {"code": "TP-04", "tool": "TPM (Mantenimiento productivo total) y OEE", "name": "Participación del operador", "name_en": "Operator involvement", "crit": {"1": "Existen estándares de mantenimiento autónomo para los operadores del área piloto; hay lecciones de un punto (LUP) para el equipo crítico del piloto.", "2": "Existen estándares autónomos y LUP para todo el equipo crítico.", "3": "Los operadores participan activamente en la gestión del programa TPM."}, "crit_en": {"1": "Autonomous-maintenance standards exist for pilot-area operators; one-point lessons (OPL) exist for the pilot's critical equipment.", "2": "Autonomous standards and OPLs exist for all critical equipment.", "3": "Operators take an active part in managing the TPM program."}}, {"code": "TP-05", "tool": "TPM (Mantenimiento productivo total) y OEE", "name": "OEE (Eficiencia general del equipo)", "name_en": "OEE (Overall Equipment Effectiveness)", "crit": {"1": "Existe un plan de seguimiento de OEE en el área piloto, con Pareto de pérdidas y planes de acción para disponibilidad, desempeño y calidad.", "2": "Hay seguimiento de OEE en todo el equipo crítico, con metas, planes y Pareto por equipo."}, "crit_en": {"1": "An OEE tracking plan exists in the pilot area, with a loss Pareto and action plans for availability, performance and quality.", "2": "OEE is tracked on all critical equipment, with goals, plans and a Pareto per equipment."}}, {"code": "TP-06", "tool": "TPM (Mantenimiento productivo total) y OEE", "name": "Programación", "name_en": "Scheduling", "crit": {"2": "Los paros planeados y la capacidad del equipo se comunican y la programación se ajusta en consecuencia."}, "crit_en": {"2": "Planned downtime and equipment capacity are communicated and scheduling is adjusted accordingly."}}, {"code": "TP-07", "tool": "TPM (Mantenimiento productivo total) y OEE", "name": "Difusión", "name_en": "Sharing", "crit": {"1": "Los logros y lecciones del piloto se comparten en toda la planta.", "2": "Se comparten con la división de negocio de ABB.", "3": "Se comparten con el Grupo ABB."}, "crit_en": {"1": "Pilot achievements and lessons are shared across the plant.", "2": "They are shared with the ABB business division.", "3": "They are shared with the ABB Group."}}, {"code": "TP-08", "tool": "TPM (Mantenimiento productivo total) y OEE", "name": "Visual", "name_en": "Visual", "crit": {"1": "El área piloto tiene su OEE (línea base y meta) y su programa de mantenimiento preventivo visibles en el área.", "2": "Todo el equipo crítico tiene OEE (línea base y meta) y programa de mantenimiento preventivo visibles."}, "crit_en": {"1": "The pilot area displays its OEE (baseline and goal) and preventive-maintenance schedule in the area.", "2": "All critical equipment displays OEE (baseline and goal) and its preventive-maintenance schedule."}}, {"code": "TP-09", "tool": "TPM (Mantenimiento productivo total) y OEE", "name": "Plan de contingencia", "name_en": "Contingency plan", "crit": {"1": "Existen planes de contingencia documentados para el equipo crítico (para calidad o entrega).", "2": "Los planes de contingencia pueden ejecutarse en 2 días hábiles.", "3": "Los planes de contingencia pueden ejecutarse en 1 día hábil."}, "crit_en": {"1": "Documented contingency plans exist for critical equipment (for quality or delivery).", "2": "Contingency plans can be executed within 2 business days.", "3": "Contingency plans can be executed within 1 business day."}}], "metrics": [{"code": "TP-E1", "tool": "TPM (Mantenimiento productivo total) y OEE", "q": "% de máquinas/estaciones con programa de mantenimiento preventivo", "q_en": "% of machines/stations with a preventive-maintenance schedule", "opts": [["< 25 %", 0], ["≥ 25 % y < 50 %", 2], ["≥ 50 % y < 90 %", 3], ["≥ 90 %", 4]], "opts_en": ["< 25%", "≥ 25% and < 50%", "≥ 50% and < 90%", "≥ 90%"]}, {"code": "TP-E2", "tool": "TPM (Mantenimiento productivo total) y OEE", "q": "Avance en las 3 principales causas de paro o calidad del OEE", "q_en": "Progress on the top 3 OEE downtime or quality causes", "opts": [["No identificadas", 0], ["Identificadas con Pareto", 2], ["Causa raíz identificada", 3], ["Soluciones con mejora demostrada en 3 meses", 4]], "opts_en": ["Not identified", "Identified with Pareto", "Root cause identified", "Solutions with improvement shown over 3 months"]}, {"code": "TP-E3", "tool": "TPM (Mantenimiento productivo total) y OEE", "q": "% del equipo crítico con OEE establecido y visible", "q_en": "% of critical equipment with OEE established and visible", "opts": [["Menos que el piloto completo", 0], ["Área piloto al 100 %", 2], ["≥ 50 % y < 90 %", 3], ["≥ 90 %", 4]], "opts_en": ["Less than the full pilot", "Pilot area at 100%", "≥ 50% and < 90%", "≥ 90%"]}, {"code": "TP-E4", "tool": "TPM (Mantenimiento productivo total) y OEE", "q": "OEE promedio de los últimos 3 meses (equipos con OEE)", "q_en": "Average OEE over the last 3 months (equipment with OEE)", "opts": [["< 25 %", 0], ["≥ 25 % y < 50 %", 2], ["≥ 50 % y < 75 %", 3], ["≥ 75 %", 4]], "opts_en": ["< 25%", "≥ 25% and < 50%", "≥ 50% and < 75%", "≥ 75%"]}, {"code": "TP-E5", "tool": "TPM (Mantenimiento productivo total) y OEE", "q": "% de mantenimientos preventivos de los últimos 12 meses completados a tiempo", "q_en": "% of preventive maintenance in the last 12 months completed on time", "opts": [["< 50 %", 0], ["≥ 50 % y < 70 %", 2], ["≥ 70 % y < 95 %", 3], ["≥ 95 %", 4]], "opts_en": ["< 50%", "≥ 50% and < 70%", "≥ 70% and < 95%", "≥ 95%"]}, {"code": "TP-E6", "tool": "TPM (Mantenimiento productivo total) y OEE", "q": "% de mantenimiento preventivo (autónomo + programado) vs. reactivo", "q_en": "% preventive maintenance (autonomous + scheduled) vs. reactive", "opts": [["< 25 %", 0], ["≥ 25 % y < 50 %", 2], ["≥ 50 % y < 85 %", 3], ["≥ 85 %", 4]], "opts_en": ["< 25%", "≥ 25% and < 50%", "≥ 50% and < 85%", "≥ 85%"]}]}, {"short": "Calidad", "name": "5. Calidad Lean", "practices": [{"code": "CA-01", "tool": "Poka-yoke y calidad en la fuente", "name": "Dispositivos a prueba de error (poka-yoke)", "name_en": "Error-proofing devices (poka-yoke)", "crit": {"1": "Hay evidencia de poka-yoke en áreas de alto riesgo (seguridad, calidad, costo, eficiencia).", "2": "Existe un proceso que usa el Pareto de defectos, desperdicio y retrabajo para identificar oportunidades de poka-yoke; los dispositivos se controlan y verifican.", "3": "Los poka-yoke equilibran detección y eliminación por diseño; los AMEF de diseño y proceso son insumo clave."}, "crit_en": {"1": "There is evidence of poka-yoke in high-risk areas (safety, quality, cost, efficiency).", "2": "A process uses the defect, scrap and rework Pareto to identify poka-yoke opportunities; devices are controlled and verified.", "3": "Poka-yokes balance detection and elimination by design; design and process FMEAs are key inputs."}}, {"code": "CA-02", "tool": "Poka-yoke y calidad en la fuente", "name": "Verificación del producto", "name_en": "Product verification", "crit": {"1": "Existen inspecciones al final de línea y auditorías que contienen problemas antes de pasar al siguiente proceso; los asociados pueden detener la línea o rechazar producto.", "2": "Las instrucciones de trabajo incluyen autoinspección e inspección sucesiva en pasos críticos. ETO: listas de verificación por tipo de orden.", "3": "Los planes de control se ajustan con la retroalimentación del cliente y la capacidad del proceso; el control estadístico sustituye la inspección rutinaria en pasos críticos."}, "crit_en": {"1": "End-of-line inspections and audits contain problems before the next process; associates can stop the line or reject product.", "2": "Work instructions include self-inspection and successive inspection at critical steps. ETO: checklists by order type.", "3": "Control plans are adjusted with customer feedback and process capability; statistical control replaces routine inspection at critical steps."}}, {"code": "CA-03", "tool": "Solución de problemas", "name": "Acción correctiva y preventiva", "name_en": "Corrective and preventive action", "crit": {"1": "Se crean acciones correctivas ante no conformidades con un método básico (p. ej., 5 pasos); se reporta su estado y se mide el tiempo de cierre.", "2": "Se usa 8D o equivalente enfocado en evitar recurrencia; se valida la eficacia y se cierra en tiempos definidos.", "3": "Las acciones se ligan a mejoras de desempeño, se replican en otros productos/procesos y se previenen problemas desde el diseño (ingeniería en ETO)."}, "crit_en": {"1": "Corrective actions are raised for nonconformities with a basic method (e.g., 5 steps); status is reported and closure time is measured.", "2": "8D or equivalent is used, focused on preventing recurrence; effectiveness is validated and closure happens within defined times.", "3": "Actions are linked to performance improvements, replicated to other products/processes and problems are prevented from design (engineering in ETO)."}}, {"code": "CA-04", "tool": "Poka-yoke y calidad en la fuente", "name": "Planeación y control de calidad (PFMEA / plan de control)", "name_en": "Quality planning and control (PFMEA / control plan)", "crit": {"1": "Uso limitado de AMEF y planes de control; el personal clave (calidad, ingeniería) está entrenado.", "2": "AMEF y planes de control se usan en procesos clave y se actualizan con cada acción correctiva o cambio de trabajo estandarizado.", "3": "AMEF y planes de control son documentos vivos; hay planes de reducción del NPR (Número de prioridad de riesgo)."}, "crit_en": {"1": "Limited use of FMEAs and control plans; key staff (quality, engineering) are trained.", "2": "FMEAs and control plans are used in key processes and updated with each corrective action or standardized-work change.", "3": "FMEAs and control plans are living documents; there are RPN (Risk Priority Number) reduction plans."}}, {"code": "CA-05", "tool": "Solución de problemas", "name": "Mejora continua de la calidad", "name_en": "Continuous quality improvement", "crit": {"1": "Se recolectan datos de calidad de proceso o producto en áreas clave y se da seguimiento a la mejora.", "2": "Los datos de calidad son visibles; un proceso estructurado prioriza oportunidades, asigna equipos de solución de problemas y da seguimiento.", "3": "Los sistemas dan datos oportunos de frecuencia, costo y punto de detección de fallas, con códigos de falla para análisis de causa raíz."}, "crit_en": {"1": "Process or product quality data are collected in key areas and improvement is tracked.", "2": "Quality data are visible; a structured process prioritizes opportunities, assigns problem-solving teams and tracks progress.", "3": "Systems provide timely data on failure frequency, cost and detection point, with failure codes for root-cause analysis."}}, {"code": "CA-06", "tool": "Solución de problemas", "name": "Análisis de causa raíz", "name_en": "Root-cause analysis", "crit": {"1": "Existen listas de causas potenciales; siempre se hace Pareto; las mejoras se basan en causas raíz identificadas.", "2": "Uso rutinario de diagramas y matrices de causa-efecto (Ishikawa) y análisis estadístico básico.", "3": "Uso consistente y validado de herramientas estadísticas (pruebas de hipótesis, regresión, DOE)."}, "crit_en": {"1": "Lists of potential causes exist; Pareto is always used; improvements are based on identified root causes.", "2": "Routine use of cause-and-effect diagrams and matrices (Ishikawa) and basic statistical analysis.", "3": "Consistent, validated use of statistical tools (hypothesis tests, regression, DOE)."}}], "metrics": [{"code": "CA-E1", "tool": "Solución de problemas", "q": "Eficacia del proceso de acción correctiva/preventiva (revisar 3 registros de los últimos 6 meses)", "q_en": "Effectiveness of the corrective/preventive action process (review 3 records from the last 6 months)", "opts": [["No establecido", 0], ["Métodos definidos y usados para eliminar causa raíz", 1], ["Métricas establecidas con mejora", 2], ["Se aplican técnicas preventivas", 3]], "opts_en": ["Not established", "Methods defined and used to remove root cause", "Metrics established with improvement", "Preventive techniques applied"]}, {"code": "CA-E2", "tool": "Poka-yoke y calidad en la fuente", "q": "¿Existen planes de acción para los 3 principales defectos internos (12 meses)?", "q_en": "Are there action plans for the top 3 internal defects (12 months)?", "opts": [["Sin contención visible", 0], ["Detección en inspección", 1], ["Detección o corrección en la fuente", 2], ["Sin recurrencia con el cliente en 6 meses", 3]], "opts_en": ["No visible containment", "Detection at inspection", "Detection or correction at the source", "No recurrence with the customer in 6 months"]}, {"code": "CA-E3", "tool": "Solución de problemas", "q": "% de acciones correctivas verificadas como eficaces en 6 meses (muestra de 10)", "q_en": "% of corrective actions verified as effective in 6 months (sample of 10)", "opts": [["< 50 % o sin acciones", 0], ["≥ 50 % y < 75 %", 1], ["≥ 75 % y < 90 %", 2], ["≥ 90 %", 3]], "opts_en": ["< 50% or no actions", "≥ 50% and < 75%", "≥ 75% and < 90%", "≥ 90%"]}, {"code": "CA-E4", "tool": "Poka-yoke y calidad en la fuente", "q": "% de procesos clave con PFMEA", "q_en": "% of key processes with PFMEA", "opts": [["< 25 %", 0], ["≥ 25 % y < 50 %", 1], ["≥ 50 % y < 90 %", 2], ["≥ 90 %", 3]], "opts_en": ["< 25%", "≥ 25% and < 50%", "≥ 50% and < 90%", "≥ 90%"]}, {"code": "CA-E5", "tool": "Poka-yoke y calidad en la fuente", "q": "% de procesos clave con plan de control vigente y dentro de límites", "q_en": "% of key processes with a current control plan within limits", "opts": [["< 10 %", 0], ["≥ 10 % y < 50 %", 1], ["≥ 50 % y < 90 %", 2], ["≥ 90 %", 3]], "opts_en": ["< 10%", "≥ 10% and < 50%", "≥ 50% and < 90%", "≥ 90%"]}]}, {"short": "Gestión diaria", "name": "6. Gestión diaria y kaizen", "practices": [{"code": "GD-01", "tool": "Gestión diaria", "name": "Recorridos del liderazgo en piso (gemba walk)", "name_en": "Leadership floor walks (gemba walk)", "crit": {"1": "El comité de Excelencia Operacional recorre el área piloto y audita el proceso cada dos semanas; participa el gerente de planta.", "2": "Recorridos semanales con rol rotativo; cada área de piso se visita al menos una vez al mes.", "3": "Recorridos semanales rotativos que incluyen oficinas; cada oficina se visita al menos una vez al mes.", "4": "Auditorías trimestrales rotativas para asegurar cumplimiento en todas las áreas."}, "crit_en": {"1": "The Operational Excellence committee walks the pilot area and audits the process every two weeks; the plant manager takes part.", "2": "Weekly walks on a rotating schedule; each shop-floor area is visited at least once a month.", "3": "Weekly rotating walks that include offices; each office is visited at least once a month.", "4": "Quarterly rotating audits ensure compliance in all areas."}}, {"code": "GD-02", "tool": "Gestión diaria", "name": "Tablero de área/celda", "name_en": "Area/cell board", "crit": {"1": "El tablero de la celda piloto cumple el formato y contenido estándar de la planta.", "2": "Todos los tableros de piso cumplen el estándar; los asociados los actualizan y están vigentes.", "3": "Todos los tableros de oficina cumplen el estándar y están vigentes."}, "crit_en": {"1": "The pilot cell board meets the plant's standard format and content.", "2": "All shop-floor boards meet the standard; associates update them and they are current.", "3": "All office boards meet the standard and are current."}}, {"code": "GD-03", "tool": "Gestión diaria", "name": "Agenda estándar de arranque", "name_en": "Standard start-up agenda", "crit": {"1": "Se usa una agenda estándar en la reunión de arranque: producción, seguridad y calidad diario, más un tema rotativo (SQDC o una capacitación breve)."}, "crit_en": {"1": "A standard agenda is used at the start-up meeting: production, safety and quality daily, plus a rotating topic (SQDC or a short training)."}}, {"code": "GD-04", "tool": "Gestión diaria", "name": "Reuniones de área/celda", "name_en": "Area/cell meetings", "crit": {"1": "Hay reunión diaria de producción a nivel planta (faltantes, producción, scorecard, acciones) y reunión de arranque en cada área de piso.", "2": "Se agrega una reunión de medio turno (≤ 5 min) para revisar programado vs. real.", "3": "Las oficinas revisan sus tableros semanalmente.", "4": "También hay reuniones después de los descansos para responder rápido a cambios del proceso."}, "crit_en": {"1": "There is a daily plant-level production meeting (shortages, output, scorecard, actions) and a start-up meeting in each shop-floor area.", "2": "A mid-shift meeting (≤ 5 min) is added to review planned vs. actual.", "3": "Offices review their boards weekly.", "4": "There are also after-break meetings to respond quickly to process changes."}}, {"code": "GD-05", "tool": "Gestión diaria", "name": "Facilitación de reuniones", "name_en": "Meeting facilitation", "crit": {"1": "Las reuniones se hacen en el tablero y las dirige el supervisor o un líder designado.", "2": "La facilitación rota entre supervisor, ingeniería de calidad, ingeniería de manufactura, etc.", "3": "Los asociados forman parte del rol rotativo de facilitación.", "4": "Cada celda tiene un líder; el equipo puede convocar reuniones rápidas para mejorar o cumplir la producción."}, "crit_en": {"1": "Meetings are held at the board and led by the supervisor or a designated leader.", "2": "Facilitation rotates among supervisor, quality engineering, manufacturing engineering, etc.", "3": "Associates are part of the facilitation rotation.", "4": "Each cell has a leader; the team can call quick meetings to improve or meet production."}}, {"code": "GD-06", "tool": "Gestión diaria", "name": "Scorecard de área (SQDC)", "name_en": "Area scorecard (SQDC)", "crit": {"1": "El área piloto tiene scorecard de Seguridad, Calidad, Entrega y Costo publicado en la celda.", "2": "Todas las áreas de piso tienen scorecard publicado.", "3": "Todas las oficinas tienen scorecard publicado."}, "crit_en": {"1": "The pilot area has a Safety, Quality, Delivery and Cost scorecard posted in the cell.", "2": "All shop-floor areas have a posted scorecard.", "3": "All offices have a posted scorecard."}}, {"code": "GD-07", "tool": "Gestión diaria", "name": "Planes de acción de área", "name_en": "Area action plans", "crit": {"1": "Supervisores y asociados fijan metas a partir del desempeño actual, con meta y celebración (típicamente a 30 días), en el área piloto.", "2": "Planes de acción en todas las áreas de piso, actualizados al menos cada 30 días y visibles.", "3": "Planes de acción en todas las oficinas, actualizados al menos cada 30 días."}, "crit_en": {"1": "Supervisors and associates set goals from current performance, with a target and a celebration (typically 30 days), in the pilot area.", "2": "Action plans in all shop-floor areas, updated at least every 30 days and visible.", "3": "Action plans in all offices, updated at least every 30 days."}}, {"code": "GD-08", "tool": "Gestión diaria", "name": "Reconocimiento", "name_en": "Recognition", "crit": {"1": "Existe un estándar de tipo y plazo de reconocimiento (recomendado ≤ 1 semana) por logro, con metas predefinidas."}, "crit_en": {"1": "There is a standard for type and timing of recognition (recommended ≤ 1 week) per achievement, with predefined goals."}}, {"code": "GD-09", "tool": "Kaizen", "name": "Resolución de problemas abiertos (lista OIL)", "name_en": "Open-issue resolution (OIL)", "crit": {"1": "En el área piloto se mantiene una lista documentada de problemas reportados por asociados, con equipo, solución, lección aprendida y fecha compromiso.", "2": "Se usa en todas las áreas de piso; los asociados implementan mejoras y se les da tiempo para hacerlo.", "3": "Se usa en todas las oficinas; la lista se revisa trimestralmente para alimentar la cartera de proyectos.", "4": "Los problemas se atienden en ≤ 6 semanas; revisión mensual para la cartera de proyectos."}, "crit_en": {"1": "The pilot area keeps a documented list of issues raised by associates, with team, solution, lesson learned and due date.", "2": "Used in all shop-floor areas; associates implement improvements and are given time to do so.", "3": "Used in all offices; the list is reviewed quarterly to feed the project portfolio.", "4": "Issues are addressed in ≤ 6 weeks; monthly review for the project portfolio."}}, {"code": "GD-10", "tool": "Kaizen", "name": "Eventos kaizen de alta intensidad", "name_en": "High-intensity kaizen events", "crit": {"1": "Se realizó un evento de alta intensidad (kaizens en secuencia o transformación del flujo de valor) en el área piloto para mejorar y estabilizar procesos.", "2": "Al menos 3 eventos kaizen en piso en los últimos 12 meses.", "3": "Al menos un evento kaizen al mes en los últimos 12 meses.", "4": "Piso y oficinas han completado eventos kaizen de forma sistemática durante los últimos 12 meses."}, "crit_en": {"1": "A high-intensity event (sequential kaizens or value-stream transformation) took place in the pilot area to improve and stabilize processes.", "2": "At least 3 shop-floor kaizen events in the last 12 months.", "3": "At least one kaizen event per month in the last 12 months.", "4": "Shop floor and offices have completed kaizen events systematically over the last 12 months."}}], "metrics": [{"code": "GD-E1", "tool": "Gestión diaria", "q": "Frecuencia de recorridos formales del liderazgo en piso", "q_en": "Frequency of formal leadership walks on the floor", "opts": [["Menos de una vez por semana", 0], ["1 vez/semana", 1], ["2 veces/semana", 2], ["3 veces/semana", 3], ["Diario", 4]], "opts_en": ["Less than once a week", "Once a week", "Twice a week", "3 times a week", "Daily"]}]}], "quiz": [{"tool": "VSM (Mapeo de flujo de valor)", "lvl": 1, "perfil": "Soporte / ingeniería", "perfil_en": "Support / engineering", "q": "¿Qué es un mapa de flujo de valor (VSM)?", "a": "Mapa de todas las acciones (con y sin valor agregado) y del flujo de información necesarias para llevar un producto desde la orden hasta el cliente. No es un diagrama de proceso.", "q_en": "What is a value stream map (VSM)?", "a_en": "A map of all actions (value-added and non-value-added) and the information flow needed to take a product from order to customer. It is not a process diagram."}, {"tool": "VSM (Mapeo de flujo de valor)", "lvl": 2, "perfil": "Soporte / ingeniería", "perfil_en": "Support / engineering", "q": "¿Qué es valor agregado y no valor agregado?", "a": "VA: lo que el cliente está dispuesto a pagar. NVA: lo que el cliente no pagaría, aunque pueda ser necesario.", "q_en": "What are value-added and non-value-added?", "a_en": "VA: what the customer is willing to pay for. NVA: what the customer would not pay for, even if necessary."}, {"tool": "VSM (Mapeo de flujo de valor)", "lvl": 3, "perfil": "Soporte / ingeniería", "perfil_en": "Support / engineering", "q": "¿Cuál es el propósito del mapa de estado futuro?", "a": "Definir la visión a un plazo dado, identificar brechas y priorizar las iniciativas para cerrarlas.", "q_en": "What is the purpose of the future-state map?", "a_en": "To define the vision for a given horizon, identify gaps and prioritize the initiatives to close them."}, {"tool": "VSM (Mapeo de flujo de valor)", "lvl": 2, "perfil": "Operativo", "perfil_en": "Operator", "q": "¿Qué paso sin valor agregado se ha eliminado o se está eliminando en tu área?", "a": "Nombra al menos un paso eliminado en los últimos dos años.", "q_en": "Which non-value-added step has been or is being removed in your area?", "a_en": "Names at least one step removed in the last two years."}, {"tool": "5S", "lvl": 1, "p
